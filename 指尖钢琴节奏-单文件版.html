/* 指尖钢琴节奏 — 对局场景 */
(function (root) {
  'use strict';
  var FP = root.FP = root.FP || {};
  var C = FP.C;
  var U = FP.U;
  var V = FP.Visuals;

  var SECTION_LABEL = { intro: '前奏', verse: '主歌', chorus: '副歌' };
  var SECTION_EN = { intro: 'INTRO', verse: 'VERSE', chorus: 'CHORUS' };

  // 执行「GameScene」负责的逻辑。
  function GameScene(game) {
    this.game = game;
    this.song = null;
    this.baseSong = null;
    this.mode = null;
    this.modeId = 'hard';
    this.judge = null;
    this.spawner = null;
    this.effects = new FP.EffectSystem();
    this.time = 0;
    this.songTime = 0;
    this.prevSongTime = 0;
    this.countdown = 3.2;
    this.countdownNum = 3;
    this.countPulse = 1;
    this.goFlash = 0;
    this.phase = 'ready';
    this.pausedFrom = 'playing';
    this.finishTimer = 0;
    this.finishing = false;
    this.failed = false;
    this.geometry = {};
    this.lanePress = [0, 0, 0, 0];
    this.activePointIds = {};
    this.holdTouches = {};
    this.displayScore = 0;
    this.displayCombo = 0;
    this.scorePulse = 0;
    this.comboPulse = 0;
    this.lastHealth = 3;
    this.healthPulse = 0;
    this.sectionName = 'intro';
    this.sectionTimer = 0;
    this.sectionBanner = null;
    this.pauseRect = null;
    this.pauseButtons = [];
    this.deadButtons = [];
    this.reviveUsed = false;
    this.adLoading = false;
    this.reviveCountdown = 0;
    this.revivePulse = 0;
    this.deadMessage = '';
    this.deadMessageTimer = 0;
    this.autoplay = !!game.debug.autoplay;
    this.timeScale = game.debug.fast ? game.debug.speed : 1;
    this.debugFast = !!game.debug.fast;
    this.pendingSummary = null;
    this.shakeX = 0;
    this.shakeY = 0;
    this.random = U.seededRandom(19);
  }

  // 进入场景：重置本局状态、布局和输入。
  GameScene.prototype.enter = function (params) {
    this.modeId = (params && params.mode) || (this.game.debug && this.game.debug.mode) || 'hard';
    this.mode = FP.Modes.get(this.modeId);
    this.baseSong = FP.Library.get(params && params.songId ? params.songId : FP.Library.songs[0].id);
    this.song = FP.Modes.buildSong(this.baseSong, this.modeId);
    this.trailColor = null;
    if (this.game.economy) {
      var trailState = this.game.economy.get();
      if (trailState.selectedTrail && trailState.selectedTrail !== 'default') this.trailColor = this.game.economy.getTrailColor();
    }
    this.time = 0;
    this.songTime = 0;
    this.prevSongTime = 0;
    this.phase = 'ready';
    this.finishing = false;
    this.failed = false;
    this.done = false;
    this.finishTimer = 0;
    this.countdown = this.debugFast ? 0.45 : 3.2;
    this.countdownNum = Math.max(1, Math.ceil(this.countdown - 0.2));
    this.countPulse = 1;
    this.goFlash = 0;
    this.lanePress = [0, 0, 0, 0];
    this.activePointIds = {};
    this.holdTouches = {};
    this.displayScore = 0;
    this.displayCombo = 0;
    this.scorePulse = 0;
    this.comboPulse = 0;
    this.lastHealth = this.mode.health;
    this.healthPulse = 0;
    this.sectionName = this.song.endless ? 'wave' : 'intro';
    this.sectionTimer = 0;
    this.wave = 1;
    this.sectionBanner = {
      text: this.song.endless ? 'WAVE 01' : '前奏',
      sub: this.song.endless ? 'ENDLESS · SPEED x1.0' : 'INTRO · SPEED x' + this.song.sections[0].speed.toFixed(1),
      life: 1.6, maxLife: 1.6
    };
    this.reviveUsed = false;
    this.adLoading = false;
    this.reviveCountdown = 0;
    this.revivePulse = 0;
    this.deadMessage = '';
    this.deadMessageTimer = 0;
    this.deadButtons = [];
    this.effects.reset();
    this.computeGeometry();
    this.judge = new FP.Judge(this.song, this.onJudgeEvent.bind(this), {
      maxHealth: this.mode.health,
      endless: !!this.song.endless
    });
    this.spawner = new FP.NoteSpawner(this.song, this.geometry);
    this.spawner.update(0, this.judge);
    this.game.setInput(this.onStart.bind(this), this.onMove.bind(this), this.onEnd.bind(this));
    this.game.audio.init();
    this.game.audio.playUi('start');
  };

  // 离开场景：停止音频并清理输入。
  GameScene.prototype.exit = function () {
    this.game.audio.stopBgm(true);
  };

  // 切到后台时暂停音频，避免后台继续播放。
  GameScene.prototype.onHide = function () {
    if (this.phase === 'playing' || this.phase === 'ready') this.openPause();
  };

  // 屏幕尺寸变化时重算布局。
  GameScene.prototype.resize = function () {
    this.computeGeometry();
    if (this.spawner) this.spawner.setGeometry(this.geometry);
  };

  // 计算「computeGeometry」结果。
  GameScene.prototype.computeGeometry = function () {
    var P = this.game.platform;
    var W = this.game.width;
    var H = this.game.height;
    var safeTop = Math.max(P.safeTop, 22);
    var safeBottom = P.safeBottom;
    var boardX = 32;
    var boardW = W - 64;
    var gap = 8;
    var laneW = (boardW - gap * 3) / 4;
    var laneX = [];
    for (var i = 0; i < 4; i++) laneX.push(boardX + i * (laneW + gap));
    var fieldTop = safeTop + 252;
    var judgeY = H - safeBottom - 236;
    if (judgeY < fieldTop + 420) judgeY = fieldTop + 420;
    var tileH = U.clamp(laneW * 1.04, 136, 182);
    this.geometry = {
      W: W, H: H,
      safeTop: safeTop, safeBottom: safeBottom,
      boardX: boardX, boardW: boardW, gap: gap,
      laneW: laneW, laneX: laneX,
      fieldTop: fieldTop, judgeY: judgeY,
      tileH: tileH,
      distance: judgeY - fieldTop + tileH,
      height: H
    };
    this.pauseRect = { x: 34, y: safeTop + 27, w: 48, h: 48, cx: 58, cy: safeTop + 51, r: 25 };
    var panelY = H * 0.27;
    var panelW = 562;
    var panelX = (W - panelW) / 2;
    this.pausePanel = { x: panelX, y: panelY, w: panelW, h: 438 };
    this.pauseButtons = [
      { id: 'resume', x: panelX + 42, y: panelY + 218, w: panelW - 84, h: 74, label: '继续演奏', variant: 'primary' },
      { id: 'restart', x: panelX + 42, y: panelY + 306, w: panelW - 84, h: 60, label: '重新开始', variant: 'ghost' },
      { id: 'quit', x: panelX + 42, y: panelY + 378, w: panelW - 84, h: 42, label: '退出曲目', variant: 'text' }
    ];
    var dpW = 582;
    var dpX = (W - dpW) / 2;
    var dpY = Math.max(safeTop + 120, H * 0.235);
    this.deadPanel = { x: dpX, y: dpY, w: dpW, h: 500 };
    this.deadButtons = [
      { id: 'revive', x: dpX + 40, y: dpY + 230, w: dpW - 80, h: 74, label: '看广告复活', variant: 'primary' },
      { id: 'end', x: dpX + 40, y: dpY + 348, w: dpW - 80, h: 50, label: '结束本局', variant: 'ghost' }
    ];
  };

  // 触摸/鼠标按下回调。
  GameScene.prototype.onStart = function (pts) {
    if (!pts || !pts.length) return;
    var p = pts[0];
    if (this.phase === 'dead') {
      for (var b = 0; b < this.deadButtons.length; b++) {
        if (U.pointInRect(p.x, p.y, this.deadButtons[b])) {
          this.handleDeadButton(this.deadButtons[b].id);
          return;
        }
      }
      return;
    }
    if (this.phase === 'paused') {
      for (var i = 0; i < this.pauseButtons.length; i++) {
        var btn = this.pauseButtons[i];
        if (U.pointInRect(p.x, p.y, btn)) { this.handlePauseButton(btn.id); return; }
      }
      return;
    }
    if (this.phase === 'revive') return;
    if (U.pointInRect(p.x, p.y, this.pauseRect)) {
      if (this.phase === 'playing' || this.phase === 'ready') this.openPause();
      return;
    }
    if (this.phase !== 'playing' || this.finishing || this.judge.failed) return;
    var g = this.geometry;
    for (var t = 0; t < pts.length; t++) {
      var pt = pts[t];
      if (pt.y < g.fieldTop - 36 || pt.y > g.H - g.safeBottom - 4) continue;
      if (pt.x < g.boardX || pt.x > g.boardX + g.boardW) continue;
      var lane = Math.floor((pt.x - g.boardX) / (g.laneW + g.gap));
      if (lane < 0) lane = 0;
      if (lane > 3) lane = 3;
      var id = pt.id != null ? String(pt.id) : ('lane-' + lane);
      if (this.activePointIds[id]) continue;
      this.activePointIds[id] = true;
      this.lanePress[lane] = 1;
      this.effects.press(lane, pt.x, pt.y, C.LANE_COLORS[lane]);
      var tile = this.findTileAt(pt.x, pt.y);
      var result = null;
      if (tile) {
        result = this.judge.hitDirect(tile.note, this.songTime);
      } else {
        this.judge.emptyTap(lane, this.songTime);
      }
      if (result && result.hold) this.holdTouches[id] = lane;
    }
  };

  // 查找手指下方正在下落的方块；长条按整段身体命中。
  GameScene.prototype.findTileAt = function (x, y) {
    var g = this.geometry;
    var list = this.spawner.visible;
    var best = null;
    var bestDist = Infinity;
    for (var i = 0; i < list.length; i++) {
      var v = list[i];
      var n = v.note;
      if (this.judge.stateOf(n) !== 0) continue;
      var left = g.laneX[n.lane] + 4;
      var right = left + g.laneW - 8;
      if (x < left - 8 || x > right + 8) continue;
      var top = v.y;
      if (n.hold) top = v.y - n.hold * v.pps;
      var bottom = v.y + g.tileH;
      if (y < top - 6 || y > bottom + 6) continue;
      var dist = Math.abs(y - (v.y + g.tileH * 0.5));
      if (dist < bestDist) {
        bestDist = dist;
        best = v;
      }
    }
    return best;
  };

  // 触摸/鼠标移动回调。
  GameScene.prototype.onMove = function () {};
  // 触摸/鼠标结束回调：结束长按并清理触点。
  GameScene.prototype.onEnd = function (pts) {
    var g = this.geometry;
    if (!pts || !pts.length) {
      var owns = Object.keys(this.holdTouches);
      for (var h = 0; h < owns.length; h++) {
        var laneH = this.holdTouches[owns[h]];
        if (this.phase === 'playing' && !this.finishing && !this.judge.failed) this.judge.handleRelease(laneH, this.songTime);
        delete this.holdTouches[owns[h]];
      }
      this.activePointIds = {};
      this.lanePress = [0, 0, 0, 0];
      return;
    }
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i];
      var id = p.id != null ? String(p.id) : null;
      if (id && this.holdTouches[id] != null) {
        var lane = this.holdTouches[id];
        if (this.phase === 'playing' && !this.finishing && !this.judge.failed) this.judge.handleRelease(lane, this.songTime);
        delete this.holdTouches[id];
      }
      if (id) delete this.activePointIds[id];
      if (p.x >= g.boardX && p.x <= g.boardX + g.boardW) {
        var l = Math.floor((p.x - g.boardX) / (g.laneW + g.gap));
        if (l >= 0 && l <= 3) this.lanePress[l] = 0;
      }
    }
  };

  // 打开「openPause」。
  GameScene.prototype.openPause = function () {
    if (this.phase === 'paused') return;
    this.pausedFrom = this.phase;
    this.phase = 'paused';
    this.game.audio.pause();
    this.game.audio.playUi('back');
    this.game.platform.haptic('light');
  };

  // 关闭「closePause」。
  GameScene.prototype.closePause = function () {
    this.phase = this.pausedFrom === 'ready' ? 'ready' : 'playing';
    if (this.phase === 'playing') this.game.audio.startBgm(this.song, this.songTime);
    this.game.audio.playUi('tap');
  };

  // 处理「handlePauseButton」对应的交互/业务逻辑。
  GameScene.prototype.handlePauseButton = function (id) {
    if (id === 'resume') {
      this.closePause();
    } else if (id === 'restart') {
      this.game.audio.stopBgm(true);
      if (!this.game.economy.canPlay(this.modeId)) {
        this.game.pendingToast = '体力不足 · 回到曲库补给后再开始';
        this.game.goTo('select');
        return;
      }
      this.game.economy.spendForMode(this.modeId);
      this.game.goTo('game', { songId: this.baseSong.id, mode: this.modeId });
    } else if (id === 'quit') {
      this.game.audio.stopBgm(true);
      this.game.goTo('select');
    }
  };

  // 处理「handleDeadButton」对应的交互/业务逻辑。
  GameScene.prototype.handleDeadButton = function (id) {
    if (id === 'end') {
      this.finish(false);
      return;
    }
    if (id !== 'revive') return;
    if (this.reviveUsed || this.adLoading || this.phase !== 'dead') return;
    if (!this.game.ads || !this.game.ads.isConfigured()) {
      this.deadMessage = '广告位接入中 · 正式版开放复活';
      this.deadMessageTimer = 2.6;
      this.game.audio.playUi('back');
      return;
    }
    this.adLoading = true;
    this.deadMessage = '';
    var self = this;
    this.game.ads.showRewarded('revive').then(function (res) {
      self.adLoading = false;
      if (self.phase !== 'dead') return;
      if (!res || !res.rewarded) {
        self.deadMessage = res && res.reason === 'closed' ? '看完广告才能复活哦' : '广告暂时不可用，请结束本局';
        self.deadMessageTimer = 2.4;
        return;
      }
      var hp = (self.game.ads.cfg && self.game.ads.cfg.reviveHp) || 1;
      if (self.judge.revive(hp)) {
        self.reviveUsed = true;
        self.phase = 'revive';
        self.reviveCountdown = 2.0;
        self.revivePulse = 1;
        self.deadMessage = '';
        self.game.audio.playRevive();
        self.game.platform.haptic('light');
        self.effects.revive(self.geometry.W / 2, self.geometry.judgeY - 120);
      }
    }).catch(function () {
      self.adLoading = false;
      self.deadMessage = '广告加载失败，请稍后重试';
      self.deadMessageTimer = 2.4;
    });
  };

  // 「onJudgeEvent」输入或生命周期回调。
  GameScene.prototype.onJudgeEvent = function (e) {
    var g = this.geometry;
    var lane = e.lane == null ? 0 : e.lane;
    var laneCenter = g.laneX[lane] + g.laneW / 2;
    var judgeY = g.judgeY;
    if (e.name === 'hit') {
      var laneColor = C.LANE_COLORS[lane];
      if (!this.debugFast) {
        var vel = e.grade === 'perfect' ? 0.98 : (e.grade === 'great' ? 0.8 : 0.65);
        this.game.audio.playNote(e.pitch, vel);
      }
      this.effects.hit(lane, e.grade, laneCenter, judgeY - 14, laneColor);
      this.lanePress[lane] = 1;
      this.displayCombo = this.judge.combo;
      this.scorePulse = 1;
      this.comboPulse = 1;
      this.healthPulse = Math.max(this.healthPulse, e.grade === 'perfect' ? 0.25 : 0);
      if (e.grade === 'perfect' && !this.debugFast) this.game.audio.playSparkle();
    } else if (e.name === 'holdstart') {
      if (!this.debugFast) this.game.audio.playNote(e.pitch, 0.75);
      this.effects.press(lane, laneCenter, judgeY - 14, C.LANE_COLORS[lane]);
      this.lanePress[lane] = 1;
      this.scorePulse = 1;
    } else if (e.name === 'holdend') {
      this.effects.hit(lane, e.grade, laneCenter, judgeY - 14, C.LANE_COLORS[lane]);
      this.displayCombo = this.judge.combo;
      this.scorePulse = 1;
      this.comboPulse = 1;
      if (!this.debugFast) this.game.audio.playSparkle();
    } else if (e.name === 'miss') {
      if (e.grace) return;
      this.effects.miss(lane, laneCenter, judgeY - 14, C.LANE_COLORS[lane]);
      if (!this.debugFast) this.game.audio.playMiss();
      this.game.platform.haptic('heavy');
      this.healthPulse = 1;
    } else if (e.name === 'milestone') {
      this.effects.milestone(e.combo);
      this.game.platform.haptic('light');
    } else if (e.name === 'revive') {
      this.healthPulse = 1;
    } else if (e.name === 'clear') {
      this.finishing = true;
      this.phase = 'ending';
      this.finishTimer = this.debugFast ? 0.15 : 1.2;
      this.pendingSummary = e;
      this.game.audio.stopBgm(false);
    } else if (e.name === 'fail') {
      this.failed = true;
      this.phase = 'dead';
      this.adLoading = false;
      this.game.audio.stopBgm(false);
      this.game.platform.haptic('heavy');
    }
  };

  // 每帧更新逻辑。
  GameScene.prototype.update = function (dt) {
    this.time += dt;
    var scaled = dt * this.timeScale;
    this.goFlash = Math.max(0, this.goFlash - dt * 2.2);
    this.countPulse = Math.max(0, this.countPulse - dt * 3.2);
    this.healthPulse = Math.max(0, this.healthPulse - dt * 3);
    this.scorePulse = Math.max(0, this.scorePulse - dt * 5.5);
    this.comboPulse = Math.max(0, this.comboPulse - dt * 6);
    this.revivePulse = Math.max(0, this.revivePulse - dt * 2.2);
    if (this.deadMessageTimer > 0) this.deadMessageTimer -= dt;
    this.lanePress[0] = Math.max(0, this.lanePress[0] - dt * 4.5);
    this.lanePress[1] = Math.max(0, this.lanePress[1] - dt * 4.5);
    this.lanePress[2] = Math.max(0, this.lanePress[2] - dt * 4.5);
    this.lanePress[3] = Math.max(0, this.lanePress[3] - dt * 4.5);
    if (this.sectionTimer > 0) this.sectionTimer -= dt;
    if (this.sectionBanner) {
      this.sectionBanner.life -= dt;
      if (this.sectionBanner.life <= 0) this.sectionBanner = null;
    }
    this.effects.update(dt);
    var shake = this.effects.shakeOffset();
    this.shakeX = shake.x;
    this.shakeY = shake.y;

    if (this.phase === 'ready') {
      var before = this.countdownNum;
      this.countdown -= scaled;
      this.countdownNum = Math.max(1, Math.ceil(this.countdown - 0.18));
      if (this.countdownNum !== before) {
        this.countPulse = 1;
        if (!this.debugFast) this.game.audio.playCountdown(false);
      }
      if (this.countdown <= 0) {
        this.phase = 'playing';
        this.goFlash = 0.8;
        this.songTime = 0;
        this.prevSongTime = 0;
        this.sectionName = this.song.endless ? 'wave' : 'intro';
        this.wave = 1;
        if (!this.debugFast) {
          this.game.audio.playCountdown(true);
          this.game.audio.startBgm(this.song, 0);
        }
      }
      return;
    }

    if (this.phase === 'paused') return;

    if (this.phase === 'dead') return;

    if (this.phase === 'revive') {
      this.reviveCountdown -= dt;
      if (this.reviveCountdown <= 0) {
        this.phase = 'playing';
        this.goFlash = 0.45;
        this.revivePulse = 1;
        this.judge.graceUntil = this.songTime + 2200;
        if (!this.debugFast) this.game.audio.startBgm(this.song, this.songTime);
      }
      return;
    }

    if (this.phase === 'ending') {
      this.finishTimer -= dt;
      if (this.finishTimer <= 0) this.finish(true);
      return;
    }

    if (this.phase !== 'playing') return;

    this.prevSongTime = this.songTime;
    this.songTime += scaled * 1000;
    if (this.autoplay) this.runAutoplay(this.prevSongTime, this.songTime);
    this.judge.update(this.songTime);
    this.spawner.update(this.songTime, this.judge);
    this.displayScore += (this.judge.score - this.displayScore) * Math.min(1, dt * 12);
    this.displayCombo += (this.judge.combo - this.displayCombo) * Math.min(1, dt * 16);
    if (this.judge.health !== this.lastHealth) {
      this.lastHealth = this.judge.health;
      this.healthPulse = 1;
    }

    var sec = FP.Chart.sectionAt(this.song, this.songTime);
    if (this.song.endless) {
      var wave = Math.floor(this.songTime / this.song.waveMs) + 1;
      if (!this.wave) this.wave = 1;
      if (wave !== this.wave) {
        this.wave = wave;
        this.sectionTimer = 1.8;
        this.sectionBanner = {
          text: 'WAVE ' + (wave < 10 ? '0' + wave : wave),
          sub: 'ENDLESS · SPEED x' + sec.speed.toFixed(1),
          life: 1.8, maxLife: 1.8
        };
        this.game.audio.playUi('tap');
      }
    } else if (sec.name !== this.sectionName) {
      this.sectionName = sec.name;
      this.sectionTimer = 1.6;
      this.sectionBanner = {
        text: SECTION_LABEL[sec.name] || sec.name,
        sub: SECTION_EN[sec.name] + ' · SPEED x' + sec.speed.toFixed(1),
        life: 1.6, maxLife: 1.6
      };
      this.game.audio.playUi('tap');
    }

    if (this.judge.failed) {
      this.phase = 'dead';
      this.game.audio.stopBgm(false);
      return;
    }

    if (this.judge.remaining <= 0 && !this.finishing) {
      this.finishing = true;
      this.phase = 'ending';
      this.finishTimer = this.debugFast ? 0.15 : 1.2;
      this.pendingSummary = this.judge.summary();
      this.game.audio.stopBgm(false);
      return;
    }

    if (this.songTime >= this.song.duration - 20) {
      this.finishing = true;
      this.phase = 'ending';
      this.finishTimer = this.debugFast ? 0.1 : 0.7;
      this.pendingSummary = this.judge.summary();
      this.game.audio.stopBgm(false);
    }
  };

  // 执行「runAutoplay」负责的逻辑。
  GameScene.prototype.runAutoplay = function (from, to) {
    for (var i = 0; i < this.song.notes.length; i++) {
      var n = this.song.notes[i];
      if (n.t > to + 4) break;
      if (n.t < from - 260) continue;
      if (this.judge.stateOf(n) === 0) {
        this.judge.handleTap(n.lane, n.t);
      }
    }
  };

  // 结束本局并写入结算数据。
  GameScene.prototype.finish = function (cleared) {
    if (this.done) return;
    this.done = true;
    var summary = this.pendingSummary || this.judge.summary();
    summary.cleared = !!cleared && summary.health > 0 && (summary.remaining == null || summary.remaining <= 0);
    summary.songId = this.baseSong.id;
    summary.baseId = this.baseSong.id;
    summary.songTitle = this.baseSong.title;
    summary.mode = this.modeId;
    summary.modeName = this.mode.name;
    summary.endless = !!this.song.endless;
    summary.duration = this.song.duration;
    summary.songTime = this.songTime;
    summary.survivalMs = this.songTime;
    summary.wave = this.song.endless ? Math.floor(this.songTime / this.song.waveMs) + 1 : 0;
    this.game.audio.stopBgm(true);
    this.game.goTo('result', { songId: this.baseSong.id, mode: this.modeId, summary: summary });
  };

  /* ---------- render ---------- */

  GameScene.prototype.render = function (ctx) {
    var g = this.geometry;
    var W = g.W, H = g.H;
    V.drawBackdrop(ctx, W, H, this.time, 'game');

    ctx.save();
    var zoom = this.effects.cameraScale();
    if (Math.abs(zoom - 1) > 0.0005) {
      ctx.translate(W / 2, H / 2);
      ctx.scale(zoom, zoom);
      ctx.translate(-W / 2, -H / 2);
    }
    ctx.translate(this.shakeX, this.shakeY);
    this.drawBoard(ctx);
    this.effects.drawLaneBeams(ctx, g);
    this.drawJudgeLine(ctx);
    this.drawNotes(ctx);
    this.effects.drawParticles(ctx);
    this.effects.drawRings(ctx);
    this.effects.drawPopups(ctx);
    this.effects.drawBanner(ctx);
    ctx.restore();

    this.drawHud(ctx);
    this.effects.drawEdge(ctx, W, H);
    this.effects.drawScreenFlash(ctx, W, H);
    this.drawSectionBanner(ctx);
    if (this.phase === 'ready') this.drawCountdown(ctx);
    if (this.phase === 'paused') this.drawPause(ctx);
    if (this.phase === 'dead') this.drawDeadModal(ctx);
    if (this.phase === 'revive') this.drawReviveOverlay(ctx);
    if (this.goFlash > 0) this.drawGoFlash(ctx);
  };

  // 绘制「drawBoard」相关界面/特效。
  GameScene.prototype.drawBoard = function (ctx) {
    var g = this.geometry;
    var boardTop = g.fieldTop - 8;
    var boardBottom = g.H - g.safeBottom - 16;
    ctx.save();
    U.roundRectPath(ctx, g.boardX - 8, boardTop, g.boardW + 16, boardBottom - boardTop, 30);
    var bg = U.linear(ctx, 0, boardTop, 0, boardBottom, [
      [0, 'rgba(7, 10, 23, 0.65)'],
      [0.5, 'rgba(10, 14, 31, 0.82)'],
      [1, 'rgba(5, 7, 17, 0.95)']
    ]);
    ctx.fillStyle = bg;
    ctx.fill();
    U.strokeRoundRect(ctx, g.boardX - 8, boardTop, g.boardW + 16, boardBottom - boardTop, 30, 'rgba(135, 164, 245, 0.11)', 1);

    for (var i = 0; i < 4; i++) {
      var x = g.laneX[i];
      var laneGrad = U.linear(ctx, x, boardTop, x, g.judgeY, [
        [0, 'rgba(255,255,255,0.012)'],
        [0.55, 'rgba(255,255,255,0.026)'],
        [1, U.rgba(C.LANE_COLORS[i], 0.025)]
      ]);
      ctx.fillStyle = laneGrad;
      ctx.fillRect(x, boardTop, g.laneW, g.judgeY - boardTop);
      if (i > 0) {
        ctx.fillStyle = 'rgba(136, 160, 227, 0.09)';
        ctx.fillRect(x - g.gap / 2 - 0.5, boardTop + 14, 1, g.judgeY - boardTop - 28);
      }
      // 顶部轨道编号
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      U.setFont(ctx, 9, 600);
      ctx.fillStyle = 'rgba(135, 158, 210, 0.34)';
      U.spacedText(ctx, '0' + (i + 1), x + g.laneW / 2, boardTop + 15, 2, 'center');
    }

    // 顶部渐隐
    var fade = U.linear(ctx, 0, boardTop, 0, boardTop + 70, [
      [0, 'rgba(5,7,16,0.92)'],
      [1, 'rgba(5,7,16,0)']
    ]);
    ctx.fillStyle = fade;
    ctx.fillRect(g.boardX - 7, boardTop + 1, g.boardW + 14, 70);
    ctx.restore();
  };

  // 绘制「drawNotes」相关界面/特效。
  GameScene.prototype.drawNotes = function (ctx) {
    var g = this.geometry;
    var visible = this.spawner.visible;
    if (!visible.length) return;
    ctx.save();
    ctx.beginPath();
    ctx.rect(g.boardX - 4, g.fieldTop - 8, g.boardW + 8, g.judgeY - g.fieldTop + 100);
    ctx.clip();

    for (var i = 0; i < visible.length; i++) {
      var v = visible[i];
      if (v.y > g.judgeY + 80 && !v.note.hold) continue;
      this.drawTileTrail(ctx, v);
    }
    for (var j = 0; j < visible.length; j++) {
      var vj = visible[j];
      if (vj.y > g.judgeY + 80 && !vj.note.hold) continue;
      this.drawTile(ctx, vj);
    }
    ctx.restore();
  };

  // 绘制「drawTileTrail」相关界面/特效。
  GameScene.prototype.drawTileTrail = function (ctx, v) {
    var g = this.geometry;
    var n = v.note;
    var color = C.LANE_COLORS[n.lane];
    var trailColor = this.trailColor || color;
    var cx = g.laneX[n.lane] + g.laneW / 2;
    var seed = ((n.t * 13 + n.lane * 71) % 1000) / 1000;
    var top = v.y;
    for (var k = 0; k < 7; k++) {
      var offset = 10 + k * 17 + ((this.songTime * 0.08 + seed * 100) % 18);
      var yy = top - offset;
      var wobble = Math.sin(this.time * 2.2 + k * 1.7 + seed * 6) * (4 + k * 1.2);
      var alpha = (1 - k / 8) * 0.18;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = trailColor;
      U.circle(ctx, cx + wobble, yy, Math.max(0.6, 2.6 - k * 0.18));
      ctx.fill();
    }
    // 竖向柔光
    ctx.globalAlpha = 0.11;
    var lg = U.linear(ctx, 0, top - 92, 0, top, [
      [0, U.rgba(trailColor, 0)],
      [1, U.rgba(trailColor, 0.35)]
    ]);
    ctx.fillStyle = lg;
    U.fillRoundRect(ctx, cx - g.laneW * 0.20, top - 92, g.laneW * 0.40, 92, 18, lg);
    ctx.globalAlpha = 1;
  };

  // 绘制「drawTile」相关界面/特效。
  GameScene.prototype.drawTile = function (ctx, v) {
    if (v.note.hold) {
      this.drawHoldTile(ctx, v);
      return;
    }
    var g = this.geometry;
    var n = v.note;
    var x = g.laneX[n.lane] + 7;
    var w = g.laneW - 14;
    var y = v.y;
    var h = g.tileH;
    var color = C.LANE_COLORS[n.lane];
    var topFade = U.clamp((y - g.fieldTop + 80) / 120, 0, 1);
    if (topFade <= 0) return;
    ctx.save();
    ctx.globalAlpha = topFade;

    // 底部投影光
    ctx.shadowColor = U.rgba(color, 0.6);
    ctx.shadowBlur = 24;
    U.fillRoundRect(ctx, x, y, w, h, 19, 'rgba(4, 6, 15, 0.95)');
    ctx.shadowBlur = 0;

    var body = U.linear(ctx, x, y, x + w, y + h, [
      [0, '#070a16'],
      [0.45, '#0d1226'],
      [1, '#151a36']
    ]);
    U.fillRoundRect(ctx, x, y, w, h, 19, body);

    var topGlow = U.linear(ctx, x, y, x, y + h * 0.5, [
      [0, U.rgba(color, 0.24)],
      [0.22, U.rgba(color, 0.07)],
      [1, U.rgba(color, 0)]
    ]);
    U.roundRectPath(ctx, x + 1, y + 1, w - 2, h * 0.5, 18);
    ctx.fillStyle = topGlow;
    ctx.fill();

    // 内层玻璃高光
    var inner = U.linear(ctx, x, y, x + w, y + h, [
      [0, 'rgba(255,255,255,0.10)'],
      [0.5, 'rgba(255,255,255,0.015)'],
      [1, 'rgba(255,255,255,0.03)']
    ]);
    U.strokeRoundRect(ctx, x + 4, y + 4, w - 8, h - 8, 15, 'rgba(255,255,255,0.08)', 1);
    ctx.fillStyle = inner;
    ctx.globalAlpha *= 0.55;
    U.roundRectPath(ctx, x + 4, y + 4, w - 8, h - 8, 15);
    ctx.fill();
    ctx.globalAlpha = topFade;

    // 左侧音轨色条
    U.fillRoundRect(ctx, x + 4, y + 20, 4, h - 40, 2, color);
    U.fillRoundRect(ctx, x + w - 7, y + 34, 2, h - 68, 1, U.rgba(color, 0.38));

    // 底部亮边
    var bl = U.linear(ctx, x, y + h - 24, x, y + h, [
      [0, U.rgba(color, 0)],
      [1, U.rgba(color, 0.44)]
    ]);
    ctx.fillStyle = bl;
    ctx.fillRect(x + 10, y + h - 24, w - 20, 24);

    // 音符图标
    U.drawNote(ctx, x + w / 2, y + h * 0.43, Math.min(48, w * 0.30), '#ffffff', 0.96);
    // 音名
    var label = C.NOTE_LABELS[C.NOTE_NAMES.indexOf(n.pitch)];
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    U.setFont(ctx, 14, 800);
    ctx.fillStyle = U.rgba(color, 0.9);
    U.spacedText(ctx, label || 'DO', x + w / 2, y + h - 38, 3, 'center');

    if (n.accent) {
      U.drawSparkle(ctx, x + w - 18, y + 17, 4.5, '#ffffff', 0.65);
    }
    ctx.restore();
  };

  // 绘制蓝色长按条：尾部长条 + 头部圆环，贴近参考视频的长条钢琴形式。
  GameScene.prototype.drawHoldTile = function (ctx, v) {
    var g = this.geometry;
    var n = v.note;
    var x = g.laneX[n.lane] + 7;
    var w = g.laneW - 14;
    var h = g.tileH;
    var y = v.y;
    var tailY = y - n.hold * v.pps;
    var bodyH = y + h - tailY;
    if (bodyH < h) bodyH = h;
    var topFade = U.clamp((y - g.fieldTop + 80) / 120, 0, 1);
    if (topFade <= 0) return;
    var active = this.judge && this.judge.stateOf(n) === 3;
    var color = active ? '#7cf6ff' : '#62b8ff';
    ctx.save();
    ctx.globalAlpha = topFade;
    ctx.shadowColor = U.rgba(color, active ? 0.9 : 0.55);
    ctx.shadowBlur = active ? 30 : 18;
    U.fillRoundRect(ctx, x, tailY, w, bodyH, 19, 'rgba(18, 34, 96, 0.92)');
    ctx.shadowBlur = 0;

    var body = U.linear(ctx, x, tailY, x, y + h, [
      [0, '#2036d9'],
      [0.42, '#315ff5'],
      [0.82, '#43c9ff'],
      [1, '#79f5ff']
    ]);
    U.fillRoundRect(ctx, x, tailY, w, bodyH, 19, body);
    U.strokeRoundRect(ctx, x + 1, tailY + 1, w - 2, bodyH - 2, 18, U.rgba(color, 0.58), 1.2);

    ctx.globalAlpha = topFade * 0.65;
    ctx.strokeStyle = 'rgba(224, 252, 255, 0.62)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x + w * 0.38, tailY + 18);
    ctx.lineTo(x + w * 0.38, y + h - 18);
    ctx.moveTo(x + w * 0.62, tailY + 18);
    ctx.lineTo(x + w * 0.62, y + h - 18);
    ctx.stroke();

    var ringY = y + h * 0.44;
    ctx.globalAlpha = topFade;
    U.strokeCircle(ctx, x + w / 2, ringY, 8, active ? '#ffffff' : 'rgba(235, 253, 255, 0.86)', 2);
    if (active) {
      U.strokeCircle(ctx, x + w / 2, ringY, 12, U.rgba(color, 0.55), 1.2);
      U.setFont(ctx, 8, 700);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      U.spacedText(ctx, 'HOLD', x + w / 2, y + h - 18, 2, 'center');
    }
    ctx.restore();
  };

  // 绘制「drawJudgeLine」相关界面/特效。
  GameScene.prototype.drawJudgeLine = function (ctx) {
    var g = this.geometry;
    var y = g.judgeY;
    var pulse = 0.5 + 0.5 * Math.sin(this.time * 3.4);
    ctx.save();
    // 光池
    var pool = U.linear(ctx, 0, y - 110, 0, y + 40, [
      [0, 'rgba(72, 233, 255, 0)'],
      [0.72, 'rgba(72, 233, 255, 0.05)'],
      [1, 'rgba(90, 225, 255, 0.14)']
    ]);
    ctx.fillStyle = pool;
    ctx.fillRect(g.boardX, y - 110, g.boardW, 150);

    ctx.globalCompositeOperation = 'lighter';
    var glow = U.linear(ctx, g.boardX, y, g.boardX + g.boardW, y, [
      [0, 'rgba(72, 233, 255, 0)'],
      [0.12, 'rgba(72, 233, 255, 0.55)'],
      [0.5, 'rgba(180, 245, 255, 0.92)'],
      [0.88, 'rgba(255, 94, 208, 0.55)'],
      [1, 'rgba(255, 94, 208, 0)']
    ]);
    ctx.fillStyle = glow;
    ctx.shadowColor = '#56eaff';
    ctx.shadowBlur = 24 + pulse * 10;
    ctx.fillRect(g.boardX, y - 1.6, g.boardW, 3.2);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 0.54;
    ctx.fillStyle = glow;
    ctx.fillRect(g.boardX, y - 8, g.boardW, 16);
    ctx.globalAlpha = 1;
    var grace = this.judge && this.judge.graceUntil > this.songTime;
    if (grace) {
      ctx.globalAlpha = 0.62 + 0.2 * pulse;
      ctx.fillStyle = C.COLORS.mint;
      ctx.shadowColor = C.COLORS.mint;
      ctx.shadowBlur = 22;
      ctx.fillRect(g.boardX, y - 1.2, g.boardW, 2.4);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      U.setFont(ctx, 8, 700);
      ctx.fillStyle = 'rgba(126, 255, 218, 0.75)';
      U.spacedText(ctx, 'REVIVE SHIELD', g.W / 2, y - 22, 2.2, 'center');
    }

    for (var i = 0; i < 4; i++) {
      var cx = g.laneX[i] + g.laneW / 2;
      var color = C.LANE_COLORS[i];
      var a = 0.55 + this.lanePress[i] * 0.45 + pulse * 0.12;
      ctx.globalAlpha = a;
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(cx, y - 7);
      ctx.lineTo(cx + 5, y);
      ctx.lineTo(cx, y + 7);
      ctx.lineTo(cx - 5, y);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    U.setFont(ctx, 8, 700);
    ctx.fillStyle = 'rgba(128, 205, 235, 0.45)';
    U.spacedText(ctx, 'JUDGEMENT', g.boardX + 2, y + 20, 2.2, 'left');
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(111, 213, 255, 0.58)';
    U.spacedText(ctx, 'BLUE = HOLD', g.boardX + g.boardW - 2, y + 20, 1.4, 'right');
    ctx.textAlign = 'left';
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
  };

  // 绘制「drawHud」相关界面/特效。
  GameScene.prototype.drawHud = function (ctx) {
    var g = this.geometry;
    var W = g.W;
    var top = g.safeTop + 18;
    ctx.save();
    // 顶部遮罩
    var shade = U.linear(ctx, 0, 0, 0, g.fieldTop + 40, [
      [0, 'rgba(3,5,13,0.92)'],
      [0.6, 'rgba(3,5,13,0.42)'],
      [1, 'rgba(3,5,13,0)']
    ]);
    ctx.fillStyle = shade;
    ctx.fillRect(0, 0, W, g.fieldTop + 40);

    // pause
    V.drawIconButton(ctx, this.pauseRect.cx, this.pauseRect.cy, this.pauseRect.r, {
      icon: 'pause', color: 'rgba(232, 240, 255, 0.88)'
    });

    // score
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    U.setFont(ctx, 10, 700);
    ctx.fillStyle = 'rgba(139, 174, 226, 0.7)';
    U.spacedText(ctx, 'SCORE', W / 2, top + 8, 3.2, 'center');
    var scoreText = U.formatScore(Math.round(this.displayScore));
    ctx.save();
    ctx.translate(W / 2, top + 57);
    var scoreScale = 1 + this.scorePulse * 0.075;
    ctx.scale(scoreScale, scoreScale);
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(80, 195, 255, 0.3)';
    ctx.shadowBlur = 18;
    U.setFont(ctx, 47, 800, '"PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif');
    ctx.fillStyle = '#f8f6ff';
    ctx.fillText(scoreText, 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();

    // combo
    var combo = Math.round(this.displayCombo);
    ctx.textAlign = 'right';
    U.setFont(ctx, 9, 700);
    ctx.fillStyle = 'rgba(139, 174, 226, 0.66)';
    U.spacedText(ctx, 'COMBO', W - 34, top + 8, 2.5, 'right');
    var comboColor = combo >= 100 ? C.COLORS.gold : (combo >= 50 ? C.COLORS.cyan : '#f6f4ff');
    ctx.save();
    ctx.translate(W - 34, top + 48);
    var comboScale = 1 + this.comboPulse * 0.12;
    ctx.scale(comboScale, comboScale);
    ctx.textAlign = 'right';
    U.setFont(ctx, 34, 800, '"PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif');
    ctx.fillStyle = comboColor;
    ctx.shadowColor = combo >= 50 ? comboColor : 'rgba(0,0,0,0)';
    ctx.shadowBlur = combo >= 50 ? 16 : 0;
    ctx.fillText(combo > 0 ? '×' + combo : '—', 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();

    // health
    var maxHp = this.judge ? this.judge.maxHealth : C.HEALTH_MAX;
    var hp = this.judge ? this.judge.health : maxHp;
    var hcx = W / 2;
    var hy = top + 91;
    var spacing = 36;
    for (var i = 0; i < maxHp; i++) {
      var hx = hcx + (i - (maxHp - 1) / 2) * spacing;
      var alive = i < hp;
      if (alive) {
        ctx.shadowColor = C.COLORS.red;
        ctx.shadowBlur = 12 + this.healthPulse * 12;
        U.drawHeart(ctx, hx, hy, 25, C.COLORS.red, null);
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 0.36;
        U.drawHeart(ctx, hx, hy - 1, 12, '#ffffff', null);
        ctx.globalAlpha = 1;
      } else {
        U.drawHeart(ctx, hx, hy, 25, null, 'rgba(255, 108, 135, 0.26)');
      }
    }
    U.setFont(ctx, 8, 700);
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(140, 163, 210, 0.45)';
    U.spacedText(ctx, 'LIFE', hcx - (maxHp * spacing) / 2 - 22, hy + 3, 1.6, 'left');

    // progress
    var py = top + 132;
    var waveMs = this.song.waveMs || 30000;
    var wave = Math.floor(this.songTime / waveMs) + 1;
    var progress = this.song.endless ? (this.songTime % waveMs) / waveMs : FP.Chart.progress(this.song, this.songTime);
    var trackTitle = this.song.endless ? '无尽回廊  ·  WAVE ' + (wave < 10 ? '0' + wave : wave) : this.baseSong.title;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    U.setFont(ctx, 15, 700);
    ctx.fillStyle = 'rgba(240, 243, 255, 0.9)';
    ctx.fillText(trackTitle, 36, py);
    var titleW = ctx.measureText(trackTitle).width;
    var modeColor = this.mode.color;
    U.drawPill(ctx, 36 + titleW + 8, py - 15, 40, 18, U.rgba(modeColor, 0.12), U.rgba(modeColor, 0.3));
    U.setFont(ctx, 9, 700);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = modeColor;
    ctx.fillText(this.mode.name, 36 + titleW + 28, py - 5);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    U.setFont(ctx, 11, 600);
    ctx.fillStyle = 'rgba(152, 170, 213, 0.62)';
    ctx.fillText(this.song.endless ? U.formatTime(this.songTime) : (U.formatTime(this.songTime) + ' / ' + U.formatTime(this.song.duration)), W - 36, py);
    var barY = py + 13;
    V.drawProgressBar(ctx, 36, barY, W - 72, 5, progress, this.mode.color, this.mode.accent);
    if (!this.song.endless) {
      for (var s = 0; s < this.song.sections.length; s++) {
        var sx = 36 + (this.song.sections[s].end / this.song.playEnd) * (W - 72);
        ctx.globalAlpha = 0.38;
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fillRect(sx - 0.6, barY - 3, 1.2, 11);
        ctx.globalAlpha = 1;
      }
    }
    var headX = 36 + progress * (W - 72);
    ctx.shadowColor = this.mode.color;
    ctx.shadowBlur = 10;
    U.fillCircle(ctx, headX, barY + 2.5, 4, '#ffffff');
    ctx.shadowBlur = 0;
    var sec = FP.Chart.sectionAt(this.song, this.songTime);
    ctx.textAlign = 'left';
    U.setFont(ctx, 9, 700);
    ctx.fillStyle = U.rgba(FP.Chart.sectionColor(sec), 0.75);
    var secLabel = this.song.endless ? ('WAVE ' + (wave < 10 ? '0' + wave : wave) + '  x' + sec.speed.toFixed(1)) :
      ((SECTION_LABEL[sec.name] || '') + '  x' + sec.speed.toFixed(1));
    U.spacedText(ctx, secLabel, 36, barY + 22, 1.2, 'left');
    ctx.restore();
  };

  // 绘制「drawSectionBanner」相关界面/特效。
  GameScene.prototype.drawSectionBanner = function (ctx) {
    var b = this.sectionBanner;
    if (!b) return;
    var t = 1 - b.life / b.maxLife;
    var alpha = Math.min(1, b.life * 3) * Math.min(1, t * 8);
    var g = this.geometry;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var y = g.fieldTop + 48;
    U.setFont(ctx, 23, 800);
    ctx.fillStyle = '#ffffff';
    U.spacedText(ctx, b.text, g.W / 2, y, 8, 'center');
    U.setFont(ctx, 9, 700);
    ctx.fillStyle = 'rgba(161, 190, 240, 0.72)';
    U.spacedText(ctx, b.sub, g.W / 2, y + 24, 2, 'center');

  // 绘制「drawCountdown」相关界面/特效。
  GameScene.prototype.drawCountdown = function (ctx) {
    var g = this.geometry;
    var W = g.W, H = g.H;
    ctx.save();
    ctx.fillStyle = 'rgba(3, 5, 13, 0.32)';
    ctx.fillRect(0, 0, W, H);

  // 绘制「drawDeadModal」相关界面/特效。
  GameScene.prototype.drawDeadModal = function (ctx) {
    var g = this.geometry;
    var W = g.W, H = g.H;
    var p = this.deadPanel;

    U.setFont(ctx, 9, 700);

    U.spacedText(ctx, 'ENERGY LOST', W / 2, p.y + 42, 4, 'center');
    U.setFont(ctx, 38, 800);
    ctx.fillStyle = '#fff0f3';

    U.setFont(ctx, 12, 500);

      ctx.globalAlpha = 1;

    if (this.game.ads && this.game.ads.isMock()) {

      ctx.fillText('当前为测试广告位 · 正式版替换为微信激励视频', W / 2, p.y + p.h - 16);

  // 绘制「drawReviveOverlay」相关界面/特效。
  GameScene.prototype.drawReviveOverlay = function (ctx) {
    var g = this.geometry;

    var cx = W / 2;

  // 绘制「drawPause」相关界面/特效。

    ctx.textBaseline = 'alphabetic';
    U.setFont(ctx, 10, 700);

    <script>
/* ---- src/scenes/result.js ---- */
/* 指尖钢琴节奏 — 结算场景 */
(function (root) {
  'use strict';
  var FP = root.FP = root.FP || {};
  var C = FP.C;
  var U = FP.U;
  var V = FP.Visuals;

  // 执行「ResultScene」负责的逻辑。
  function ResultScene(game) {
    this.game = game;
    this.song = null;
    this.summary = null;
    this.time = 0;
    this.entry = 0;
    this.scoreDisplay = 0;
    this.best = 0;
    this.newBest = false;
    this.grade = null;
    this.buttons = [];
    this.pressed = -1;
    this.pressedNext = false;
    this.confetti = [];
    this.celebrated = false;
    this.layout = null;
  }

  // 进入场景：重置本局状态、布局和输入。
  ResultScene.prototype.enter = function (params) {
    this.song = FP.Library.get(params.songId);
    this.summary = params.summary;
    this.modeId = params.mode || this.summary.mode || 'hard';
    this.mode = FP.Modes.get(this.modeId);
    this.nextSong = FP.Library.songs[(this.song.index || 1) % FP.Library.songs.length];
    this.time = 0;
    this.entry = 0;
    this.scoreDisplay = 0;
    this.newBest = FP.Library.setBest(this.song.id, this.summary.score, this.modeId);
    this.best = FP.Library.getBest(this.song.id, this.modeId);
    this.grade = U.getGrade(this.summary.accuracy);
    this.reward = { stars: 0, first: false };
    this.refundTicket = 0;
    if (this.summary.cleared) {
      this.reward = this.game.economy.awardFirstClear(this.song.id, this.modeId, this.grade.grade);
      if (this.grade.grade === 'S' || this.grade.grade === 'A') {
        this.refundTicket = this.game.economy.refundTicket();
      }
    }
    this.confetti = [];
    this.celebrated = false;
    this.pressed = -1;
    this.pressedNext = false;
    this.computeLayout();
    this.game.setInput(this.onStart.bind(this), null, this.onEnd.bind(this));
    this.spawnConfetti(this.summary.cleared ? 72 : 0);
    if (!this.game.debug.fast) {
      if (this.summary.cleared) {
        var notes = ['C4', 'E4', 'G4', 'B4'];
        for (var i = 0; i < notes.length; i++) {
          var self = this;
          setTimeout((function (pitch, delay) {
            return function () { self.game.audio.playNote(pitch, 0.55); };
          })(notes[i], i * 90), 220 + i * 90);
        }
        this.game.platform.haptic('light');
      } else {
        this.game.audio.playMiss();
      }
    }
  };

  // 离开场景：停止音频并清理输入。
  ResultScene.prototype.exit = function () {};

  // 屏幕尺寸变化时重算布局。
  ResultScene.prototype.resize = function () { this.computeLayout(); };

  // 计算当前屏幕下的安全区与控件布局。
  ResultScene.prototype.computeLayout = function () {
    var W = this.game.width;
    var H = this.game.height;
    var safeTop = Math.max(this.game.platform.safeTop, 22);
    var safeBottom = this.game.platform.safeBottom;
    var extra = Math.max(0, H - 1334);
    var l = {
      W: W, H: H, safeTop: safeTop, safeBottom: safeBottom,
      headerY: safeTop + 14,
      heroY: safeTop + 136 + extra * 0.04,
      scoreY: safeTop + 326 + extra * 0.20,
      statsY: safeTop + 522 + extra * 0.34,
      detailY: safeTop + 670 + extra * 0.46,
      buttonY: H - safeBottom - 286
    };
    var bw = W - 96;
    this.buttons = [
      { id: 'retry', x: 48, y: l.buttonY, w: bw, h: 74, label: this.summary && !this.summary.cleared ? '再次挑战' : '再来一次', variant: 'primary' },
      { id: 'back', x: 48, y: l.buttonY + 90, w: bw, h: 58, label: '返回曲库', variant: 'ghost' }
    ];
    this.nextRect = { x: 48, y: l.detailY + 136, w: W - 96, h: 112 };
    this.layout = l;
  };

  // 触摸/鼠标按下回调。
  ResultScene.prototype.onStart = function (pts) {
    if (!pts || !pts.length) return;
    var p = pts[0];
    if (this.nextRect && U.pointInRect(p.x, p.y, this.nextRect)) { this.pressedNext = true; return; }
    for (var i = 0; i < this.buttons.length; i++) {
      if (U.pointInRect(p.x, p.y, this.buttons[i])) { this.pressed = i; return; }
    }
  };

  // 触摸/鼠标结束回调。
  ResultScene.prototype.onEnd = function (pts) {
    if (this.pressedNext) {
      this.pressedNext = false;
      this.startRun(this.nextSong.id);
      return;
    }
    if (this.pressed < 0) return;
    var id = this.buttons[this.pressed].id;
    this.pressed = -1;
    this.game.audio.playUi('back');
    this.game.platform.haptic('light');
    if (id === 'retry') this.startRun(this.song.id);
    else this.game.goTo('select');
  };

  // 启动「startRun」流程。
  ResultScene.prototype.startRun = function (songId) {
    if (!this.game.economy.canPlay(this.modeId)) {
      this.game.pendingToast = '体力不足 · 回到曲库补给后再开始';
      this.game.goTo('select');
      return;
    }
    this.game.economy.spendForMode(this.modeId);
    this.game.audio.playUi('start');
    this.game.platform.haptic('light');
    this.game.goTo('game', { songId: songId, mode: this.modeId });
  };

  // 生成「spawnConfetti」对象/特效。
  ResultScene.prototype.spawnConfetti = function (count) {
    var colors = [this.song.theme.a, this.song.theme.b, C.COLORS.gold, C.COLORS.cyan, '#ffffff', C.COLORS.pink];
    for (var i = 0; i < count; i++) {
      this.confetti.push({
        x: Math.random() * this.game.width,
        y: -20 - Math.random() * 300,
        vx: (Math.random() - 0.5) * 70,
        vy: 70 + Math.random() * 180,
        w: 3 + Math.random() * 5,
        h: 6 + Math.random() * 9,
        rot: Math.random() * U.TAU,
        vr: (Math.random() - 0.5) * 7,
        color: colors[(Math.random() * colors.length) | 0],
        alpha: 0.5 + Math.random() * 0.5,
        sway: Math.random() * U.TAU
      });
    }
  };

  // 每帧更新逻辑。
  ResultScene.prototype.update = function (dt) {
    this.time += dt;
    this.entry = U.clamp(this.entry + dt * 2.4, 0, 1);
    var target = this.summary ? this.summary.score : 0;
    this.scoreDisplay += (target - this.scoreDisplay) * Math.min(1, dt * 4.2);
    if (Math.abs(target - this.scoreDisplay) < 1) this.scoreDisplay = target;
    if (!this.celebrated && this.time > 0.3 && this.summary && this.summary.cleared) {
      this.celebrated = true;
    }
    for (var i = this.confetti.length - 1; i >= 0; i--) {
      var p = this.confetti[i];
      p.x += p.vx * dt + Math.sin(this.time * 2 + p.sway) * 12 * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      if (p.y > this.game.height + 40) this.confetti.splice(i, 1);
    }
  };

  // 绘制当前画面。
  ResultScene.prototype.render = function (ctx) {
    var W = this.layout.W, H = this.layout.H;
    var theme = this.song.theme;
    V.drawBackdrop(ctx, W, H, this.time, 'result');
    // theme glow
    var g = U.radial(ctx, W * 0.5, 330, 0, 420, [
      [0, U.rgba(theme.a, 0.14)],
      [0.55, U.rgba(theme.b, 0.05)],
      [1, 'rgba(0,0,0,0)']
    ]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    this.drawConfetti(ctx);

    var entry = U.easeOutCubic(this.entry);
    ctx.save();
    ctx.globalAlpha = entry;

    // header
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    U.setFont(ctx, 10, 700);
    ctx.fillStyle = 'rgba(137, 171, 228, 0.7)';
    U.spacedText(ctx, 'PERFORMANCE RESULT', W / 2, this.layout.headerY + 12, 4, 'center');
    var endless = !!this.summary.endless;
    var title = endless ? (this.summary.cleared ? '无尽通关' : '无尽结束') : (this.summary.cleared ? '演奏完成' : '能量耗尽');
    var accent = endless ? this.mode.color : (this.summary.cleared ? C.COLORS.cyan : '#ff7088');
    var titleGrad = U.linear(ctx, W / 2 - 200, 0, W / 2 + 200, 0, [
      [0, accent],
      [0.5, '#ffffff'],
      [1, this.summary.cleared ? C.COLORS.violet : (endless ? C.COLORS.pink : '#ff9a7a')]
    ]);
    ctx.shadowColor = U.rgba(accent, 0.4);
    ctx.shadowBlur = 22;
    U.setFont(ctx, 46, 800);
    ctx.fillStyle = titleGrad;
    ctx.fillText(title, W / 2, this.layout.headerY + 66);
    ctx.shadowBlur = 0;
    U.setFont(ctx, 11, 600);
    ctx.fillStyle = 'rgba(154, 174, 217, 0.62)';
    var sub = endless ?
      ('ENDLESS RUSH  ·  WAVE ' + ('0' + (this.summary.wave || 1)).slice(-2) + '  ·  ' + U.formatTime(this.summary.survivalMs || 0)) :
      (this.summary.cleared ? 'TRACK COMPLETE  ·  KEEP THE RHYTHM' : 'TRY AGAIN  ·  FEEL THE BEAT');
    U.spacedText(ctx, sub, W / 2, this.layout.headerY + 92, 1.8, 'center');

    this.drawHero(ctx);
    this.drawScore(ctx);
    this.drawStats(ctx);
    this.drawDetails(ctx);
    this.drawNext(ctx);
    this.drawButtons(ctx);

    ctx.textAlign = 'center';
    U.setFont(ctx, 11, 600);
    ctx.fillStyle = 'rgba(130, 148, 192, 0.5)';
    U.spacedText(ctx, 'FINGERTIP RHYTHM  ·  CHAPTER 01', W / 2, H - this.layout.safeBottom - 26, 2, 'center');
    ctx.restore();
  };

  // 绘制「drawHero」相关界面/特效。
  ResultScene.prototype.drawHero = function (ctx) {
    var L = this.layout;
    var song = this.song;
    var x = 48;
    var y = L.heroY;
    var cover = 164;
    ctx.save();
    ctx.globalAlpha *= U.easeOutCubic(U.clamp(this.entry * 1.2, 0, 1));
    // halo
    var halo = U.radial(ctx, x + cover / 2, y + cover / 2, cover * 0.3, cover * 0.95, [
      [0, U.rgba(song.theme.a, 0.2)],
      [1, 'rgba(0,0,0,0)']
    ]);
    ctx.fillStyle = halo;
    ctx.fillRect(x - 60, y - 60, cover + 120, cover + 120);
    V.drawCoverArt(ctx, x, y, cover, cover, song, this.time);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    var tx = x + cover + 30;
    U.setFont(ctx, 10, 700);
    ctx.fillStyle = U.rgba(this.mode.color, 0.85);
    U.spacedText(ctx, 'TRACK ' + ('0' + song.index).slice(-2) + '  /  ' + this.mode.en, tx, y + 25, 2, 'left');
    U.setFont(ctx, 40, 800);
    ctx.fillStyle = '#f8f6ff';
    var heroTitle = this.summary.endless ? '无尽回廊' : song.title;
    ctx.fillText(heroTitle, tx, y + 72);
    U.setFont(ctx, 10, 600);
    ctx.fillStyle = 'rgba(158, 179, 224, 0.62)';
    var heroSub = this.summary.endless ? ('ENDLESS RUSH  ·  BASE ' + song.title) : song.subtitle;
    U.spacedText(ctx, U.truncateText(ctx, heroSub, 290), tx, y + 96, 1.2, 'left');
    U.setFont(ctx, 13, 500);
    ctx.fillStyle = 'rgba(171, 184, 216, 0.75)';
    ctx.fillText(this.summary.endless ? '程序生成谱面 · 速度随波次递增' : song.artist, tx, y + 124);
    U.setFont(ctx, 11, 600);

    <script>
/* ---- src/scenes/modes.js ---- */
/* 指尖钢琴节奏 — 玩法实验室 / 好友榜 */
(function (root) {
  'use strict';
  var FP = root.FP = root.FP || {};
  var C = FP.C;
  var U = FP.U;
  var V = FP.Visuals;

  var MODES = [
    {
      id: 'classic', title: '经典钢琴', en: 'PIANO TILES',
      color: '#48e9ff', accent: '#9a7bff', scene: 'select',
      desc: '四轨下落 · 蓝条长按 · 已收录 20 首',
      rule: '直接点下落方块或蓝条，任意纵向位置都可点击；蓝条要按住到尾', badge: '20 TRACKS'
    },
    {
      id: 'marble', title: '滚珠音阶', en: 'MARBLE RESONANCE',
      color: '#63ffd2', accent: '#48e9ff', scene: 'marble',
      desc: '钢珠下落 · 撞击踏板 · 60 秒',
      rule: '左右轻推引导钢珠，撞响更多音钉', badge: 'PHYSICS'
    },
    {
      id: 'studio', title: '双人创作', en: 'DUET STUDIO',
      color: '#ff5ed0', accent: '#ffb547', scene: 'studio',
      desc: '同屏双人 · 实时作曲 · 45 秒',
      rule: '邀请身边朋友，同一画面轮流落音符比拼', badge: '2 PLAYERS'
    },
    {
      id: 'echo', title: '回声记忆', en: 'ECHO MEMORY',
      color: '#ffb547', accent: '#ff5ed0', scene: 'echo',
      desc: '记住旋律 · 逐轮复现 · 3 次机会',
      rule: '听一遍四音序列，再按相同顺序点亮', badge: 'MEMORY'
    }
  ];

  // 执行「ModeScene」负责的逻辑。
  function ModeScene(game) {
    this.game = game;
    this.time = 0;
    this.entry = 0;
    this.pressed = -1;
    this.layout = null;
    this.modal = false;
    this.lbMode = 'classic';
    this.tabs = [];
    this.toastText = '';
    this.toastTimer = 0;
    this.best = {};
    this.lbRows = [];
  }

  // 进入玩法实验室；从首页左上角好友榜进入时直接打开榜单。
  ModeScene.prototype.enter = function (params) {
    this.time = 0;
    this.entry = 0;
    this.pressed = -1;
    this.modal = false;
    this.computeLayout();
    this.refreshBests();
    if (params && params.openLeaderboard) {
      this.modal = true;
      this.refreshRows();
    }
    this.game.setInput(this.onStart.bind(this), null, this.onEnd.bind(this));
  };

  // 离开场景：停止音频并清理输入。
  ModeScene.prototype.exit = function () {};
  // 屏幕尺寸变化时重算布局。
  ModeScene.prototype.resize = function () { this.computeLayout(); };

  // 刷新各玩法最佳成绩缓存。
  ModeScene.prototype.refreshBests = function () {
    for (var i = 0; i < MODES.length; i++) this.best[MODES[i].id] = FP.Social.getBest(MODES[i].id);
  };

  // 刷新好友榜行数据。
  ModeScene.prototype.refreshRows = function () {
    this.lbRows = FP.Social.getRows(this.lbMode);
  };

  // 计算当前屏幕下的安全区与控件布局。
  ModeScene.prototype.computeLayout = function () {
    var W = this.game.width, H = this.game.height;
    var safeTop = Math.max(this.game.platform.safeTop, 20);
    var safeBottom = this.game.platform.safeBottom;
    var top = safeTop + 18;
    var cardH = U.clamp((H - safeTop - safeBottom - 360) / 4, 132, 190);
    var gap = 12;
    var cardsY = top + 174;
    this.layout = { W: W, H: H, safeTop: safeTop, safeBottom: safeBottom, top: top, cardH: cardH, gap: gap, cardsY: cardsY };
    this.backRect = { x: 34, y: top + 24, w: 48, h: 48, cx: 58, cy: top + 48, r: 24 };
    this.cards = [];
    for (var i = 0; i < MODES.length; i++) {
      this.cards.push({ x: 36, y: cardsY + i * (cardH + gap), w: W - 72, h: cardH, mode: MODES[i] });
    }
    this.lbRect = { x: 36, y: cardsY + 4 * (cardH + gap) + 16, w: W - 72, h: 88 };
    this.modalPanel = { x: 48, y: safeTop + 86, w: W - 96, h: Math.min(700, H - safeTop - safeBottom - 140) };
    this.closeRect = { x: this.modalPanel.x + this.modalPanel.w - 54, y: this.modalPanel.y + 24, w: 34, h: 34 };
    this.inviteRect = { x: this.modalPanel.x + 36, y: this.modalPanel.y + this.modalPanel.h - 74, w: this.modalPanel.w - 72, h: 50 };
    this.tabs = [];
    var tw = (this.modalPanel.w - 72 - 24) / 4;
    for (var t = 0; t < MODES.length; t++) {

    }
  };

  // 每帧更新逻辑。
  ModeScene.prototype.update = function (dt) {

  };

  // 触摸/鼠标按下回调。
  ModeScene.prototype.onStart = function (pts) {
    if (!pts || !pts.length) return;
    var p = pts[0];

        this.modal = false;
        this.game.audio.playUi('back');
        return;
      }
      for (var t = 0; t < this.tabs.length; t++) {

          this.lbMode = this.tabs[t].id;

          return;
        }
      }
      if (U.pointInRect(p.x, p.y, this.inviteRect)) {
        var url = FP.Social.makeInvite(this.lbMode);
        if (FP.Platform.isWechat) {
          FP.Platform.share({ title: '来挑战我的「' + this.modeTitle(this.lbMode) + '」成绩：' + FP.Social.getBest(this.lbMode) });
          this.showToast('已调起微信分享');
        } else {
          FP.Platform.copyText(url);
          this.showToast('邀请链接已复制');
        }
        this.game.audio.playUi('start');
        return;
      }
      return;
    }
    if (U.pointInRect(p.x, p.y, this.backRect)) {
      this.game.goTo('select');
      this.game.audio.playUi('back');
      return;
    }
    for (var i = 0; i < this.cards.length; i++) {
      if (U.pointInRect(p.x, p.y, this.cards[i])) {
        this.pressed = i;
        return;
      }
    }
    if (U.pointInRect(p.x, p.y, this.lbRect)) {
      this.modal = true;
      this.refreshRows();
      this.game.audio.playUi('tap');
    }
  };

  // 触摸/鼠标结束回调。
  ModeScene.prototype.onEnd = function () {
    if (this.pressed < 0) return;
    var idx = this.pressed;
    this.pressed = -1;
    var mode = this.cards[idx].mode;
    this.startMode(mode);
  };

  // 启动「startMode」流程。
  ModeScene.prototype.startMode = function (mode) {
    if (mode.id === 'classic') {
      this.game.goTo('select');
      this.game.audio.playUi('start');
      return;
    }
    if (!this.game.economy.canPlay(mode.id)) {
      this.showToast('节拍券不足 · 回曲库领取每日补给');
      this.game.audio.playUi('back');
      return;
    }
    this.game.economy.spendForMode(mode.id);
    this.game.audio.playUi('start');
    this.game.goTo(mode.scene, { mode: mode.id });
  };

  // 执行「modeTitle」负责的逻辑。
  ModeScene.prototype.modeTitle = function (id) {
    for (var i = 0; i < MODES.length; i++) if (MODES[i].id === id) return MODES[i].title;

  };

  // 执行「showToast」负责的逻辑。
  ModeScene.prototype.showToast = function (text) {
    this.toastText = text;
    this.toastTimer = 2.2;
  };

  // 绘制当前画面。
  ModeScene.prototype.render = function (ctx) {
    var L = this.layout;
    V.drawBackdrop(ctx, L.W, L.H, this.time, 'select');

    for (var i = 0; i < this.cards.length; i++) this.drawModeCard(ctx, this.cards[i], MODES[i]);

    this.drawFooter(ctx);
    if (this.modal) this.drawLeaderboard(ctx);
    this.drawToast(ctx);
  };

  // 绘制「drawHeader」相关界面/特效。
  ModeScene.prototype.drawHeader = function (ctx) {
    var L = this.layout;
    V.drawIconButton(ctx, this.backRect.cx, this.backRect.cy, this.backRect.r, { icon: 'back' });

    ctx.textBaseline = 'alphabetic';
    U.setFont(ctx, 9, 700);
    ctx.fillStyle = 'rgba(138, 171, 228, 0.66)';
    U.spacedText(ctx, 'ARCADE LAB  /  SEASON 02', 96, L.top + 35, 2.4, 'left');
    U.setFont(ctx, 39, 800);
    ctx.fillStyle = '#f7f5ff';
    ctx.fillText('玩法实验室', 96, L.top + 76);
    U.setFont(ctx, 10, 500);
    ctx.fillStyle = 'rgba(153, 175, 218, 0.65)';
    ctx.fillText('同一架钢琴，不止一种玩法。', 96, L.top + 96);
    var w = this.game.economy.get();
    ctx.textAlign = 'right';
    U.setFont(ctx, 10, 600);
    ctx.fillStyle = 'rgba(160, 180, 220, 0.7)';
    ctx.fillText('节拍券 ' + w.stamina + '/' + w.maxStamina, L.W - 36, L.top + 46);
    ctx.fillStyle = '#ffd76a';
    ctx.fillText('星钻 ' + w.diamonds, L.W - 36, L.top + 68);
  };

  // 绘制「drawModeCard」相关界面/特效。
  ModeScene.prototype.drawModeCard = function (ctx, rect, mode) {
    var pressed = this.pressed === MODES.indexOf(mode);
    var x = rect.x, y = rect.y, w = rect.w, h = rect.h;
    var entry = U.easeOutCubic(U.clamp((this.entry - MODES.indexOf(mode) * 0.08) / 0.45, 0, 1));
    if (entry <= 0) return;

    ctx.globalAlpha = entry;
    if (pressed) {
      ctx.translate(0, 2);

    <script>
/* ---- src/scenes/marble.js ---- */
/* 指尖钢琴节奏 — 滚珠音阶：钢珠撞击音钉的物理小游戏 */
(function (root) {
  'use strict';
  var FP = root.FP = root.FP || {};
  var C = FP.C;
  var U = FP.U;
  var V = FP.Visuals;

  // 执行「MarbleScene」负责的逻辑。
  function MarbleScene(game) {
    this.game = game;
    this.time = 0;
    this.phase = 'playing';
    this.score = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.hits = 0;
    this.balls = 3;
    this.timeLeft = 60;
    this.ball = null;
    this.pegs = [];
    this.particles = [];
    this.rings = [];
    this.sideFlash = [0, 0];
    this.resultLayout = null;
    this.best = 0;
    this.newBest = false;
    this.pressed = '';
    this.spawnTimer = 0;
    this.geometry = null;
  }

  // 进入场景：重置本局状态、布局和输入。
  MarbleScene.prototype.enter = function () {
    var W = this.game.width, H = this.game.height;
    var safeTop = Math.max(this.game.platform.safeTop, 20);
    var safeBottom = this.game.platform.safeBottom;
    var boardX = 38, boardW = W - 76;
    var top = safeTop + 170;
    var bottom = H - safeBottom - 100;
    this.geometry = { W: W, H: H, safeTop: safeTop, safeBottom: safeBottom, boardX: boardX, boardW: boardW, top: top, bottom: bottom };
    this.pegs = [];
    var lanes = [C.LANE_COLORS[0], C.LANE_COLORS[1], C.LANE_COLORS[2], C.LANE_COLORS[3]];
    var pitches = ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4'];
    for (var row = 0; row < 6; row++) {
      for (var col = 0; col < 5; col++) {
        var x = boardX + 60 + col * ((boardW - 120) / 4) + (row % 2 ? 26 : -26);
        x = U.clamp(x, boardX + 40, boardX + boardW - 40);
        this.pegs.push({
          x: x,
          y: top + 70 + row * ((bottom - top - 160) / 5) + (col % 2 ? 16 : -10),
          r: 17,
          color: lanes[(row + col) % 4],
          pitch: pitches[(row * 2 + col) % 7],
          flash: 0,
          lastHit: -9999
        });
      }
    }
    this.score = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.hits = 0;
    this.balls = 3;
    this.timeLeft = 60;
    this.time = 0;
    this.phase = 'playing';
    this.particles = [];
    this.rings = [];
    this.sideFlash = [0, 0];
    this.spawnTimer = 0;
    this.pressed = '';
    this.spawnBall();
    this.best = FP.Social.getBest('marble');
    this.resultLayout = FP.ArcadeUI.layout(W, H, safeBottom);
    this.game.setInput(this.onStart.bind(this), null, this.onEnd.bind(this));
    this.game.audio.init();
    this.game.audio.startBgm(FP.Library.get('neon-heart'), 0);
  };

  // 离开场景：停止音频并清理输入。
  MarbleScene.prototype.exit = function () { this.game.audio.stopBgm(true); };
  // 切到后台时暂停音频，避免后台继续播放。
  MarbleScene.prototype.onHide = function () { this.game.audio.stopBgm(false); };

  // 在顶部生成一颗新的钢珠。
  MarbleScene.prototype.spawnBall = function () {
    var g = this.geometry;
    this.ball = {
      x: g.boardX + g.boardW / 2 + (Math.random() - 0.5) * 80,
      y: g.top + 20,
      vx: (Math.random() - 0.5) * 100,
      vy: 80,
      r: 14,
      trail: []
    };
    this.spawnTimer = 0;
  };

  // 触摸/鼠标按下回调。
  MarbleScene.prototype.onStart = function (pts) {
    if (!pts || !pts.length) return;
    var p = pts[0];
    if (this.phase === 'result') {
      var L = this.resultLayout;
      if (U.pointInRect(p.x, p.y, L.retry)) this.retry();
      else if (U.pointInRect(p.x, p.y, L.back)) this.game.goTo('modes');
      return;
    }
    if (U.pointInRect(p.x, p.y, FP.ArcadeUI.backRect(this.game))) {
      this.game.goTo('modes');
      return;
    }
    if (this.phase !== 'playing' || !this.ball) return;
    if (p.x < this.geometry.W / 2) {
      this.ball.vx -= 300;
      this.sideFlash[0] = 1;
    } else {
      this.ball.vx += 300;
      this.sideFlash[1] = 1;
    }
    this.ball.vx = U.clamp(this.ball.vx, -650, 650);
    this.spawnRing(this.ball.x, this.ball.y, C.COLORS.cyan);
    this.game.platform.haptic('light');
    this.game.audio.playUi('tap');
  };

  // 触摸/鼠标结束回调。
  MarbleScene.prototype.onEnd = function () {};

  // 结束本局并写入结算数据。
  MarbleScene.prototype.finish = function () {
    if (this.phase === 'result') return;
    this.phase = 'result';
    this.game.audio.stopBgm(false);
    this.newBest = FP.Social.submit('marble', this.score);
    this.best = FP.Social.getBest('marble');
    this.game.platform.haptic('light');
    this.game.audio.playCoin();
  };

  // 重新开始本局，并重新扣除入场资源。
  MarbleScene.prototype.retry = function () {
    if (!this.game.economy.canPlay('marble')) {
      this.game.goTo('modes');
      return;
    }
    this.game.economy.spendForMode('marble');
    this.game.goTo('marble');
  };

  // 每帧更新逻辑。
  MarbleScene.prototype.update = function (dt) {
    this.time += dt;
    this.sideFlash[0] = Math.max(0, this.sideFlash[0] - dt * 4);
    this.sideFlash[1] = Math.max(0, this.sideFlash[1] - dt * 4);
    for (var p = this.particles.length - 1; p >= 0; p--) {
      var pa = this.particles[p];
      pa.life -= dt;
      if (pa.life <= 0) { this.particles.splice(p, 1); continue; }
      pa.vy += 600 * dt;
      pa.x += pa.vx * dt;
      pa.y += pa.vy * dt;
    }
    for (var r = this.rings.length - 1; r >= 0; r--) {
      this.rings[r].life -= dt;
      if (this.rings[r].life <= 0) this.rings.splice(r, 1);
    }
    for (var i = 0; i < this.pegs.length; i++) this.pegs[i].flash = Math.max(0, this.pegs[i].flash - dt * 4);
    if (this.phase !== 'playing') return;
    this.timeLeft -= dt;
    if (this.timeLeft <= 0) { this.timeLeft = 0; this.finish(); return; }
    if (!this.ball) {
      this.spawnTimer -= dt;
      if (this.spawnTimer <= 0) this.spawnBall();
      return;
    }
    var g = this.geometry;
    var b = this.ball;
    b.vy += 760 * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.vx *= Math.pow(0.996, dt * 60);
    if (b.x - b.r < g.boardX) { b.x = g.boardX + b.r; b.vx = Math.abs(b.vx) * 0.82; }
    if (b.x + b.r > g.boardX + g.boardW) { b.x = g.boardX + g.boardW - b.r; b.vx = -Math.abs(b.vx) * 0.82; }
    if (b.y - b.r < g.top) { b.y = g.top + b.r; b.vy = Math.abs(b.vy) * 0.7; }

    for (var k = 0; k < this.pegs.length; k++) {
      var peg = this.pegs[k];
      var dx = b.x - peg.x, dy = b.y - peg.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var min = b.r + peg.r;
      if (dist < min && dist > 0.001) {
        var nx = dx / dist, ny = dy / dist;
        b.x = peg.x + nx * min;
        b.y = peg.y + ny * min;
        var dot = b.vx * nx + b.vy * ny;
        b.vx -= 1.65 * dot * nx;
        b.vy -= 1.65 * dot * ny;
        b.vy = Math.min(b.vy, -120);
        b.vx += (Math.random() - 0.5) * 60;
        if (this.time - peg.lastHit > 0.24) {
          peg.lastHit = this.time;
          peg.flash = 1;
          this.hitPeg(peg, b.x, b.y);
        }
      }
    }

    b.trail.unshift({ x: b.x, y: b.y });
    if (b.trail.length > 12) b.trail.pop();
    if (b.y - b.r > g.bottom + 20) {
      this.balls--;
      this.ball = null;
      this.combo = 0;
      this.game.audio.playMiss();
      if (this.balls <= 0) this.finish();
      else this.spawnTimer = 0.55;
    }
  };

  // 钢珠撞到音钉后的计分与音效反馈。
  MarbleScene.prototype.hitPeg = function (peg, x, y) {
    this.combo++;
    this.maxCombo = Math.max(this.maxCombo, this.combo);
    this.hits++;
    var gain = 100 + Math.min(10, this.combo) * 10;
    this.score += gain;
    this.game.audio.playNote(peg.pitch, 0.9);
    this.game.audio.playSparkle();
    this.spawnRing(x, y, peg.color);
    this.spawnBurst(x, y, peg.color, 12);
    this.game.platform.haptic('light');
  };

  // 在指定位置生成扩散光环。
  MarbleScene.prototype.spawnRing = function (x, y, color) {
    this.rings.push({ x: x, y: y, r: 8, maxR: 62, life: 0.42, maxLife: 0.42, color: color });
  };

  // 在指定位置生成粒子爆发。
  MarbleScene.prototype.spawnBurst = function (x, y, color, count) {
    for (var i = 0; i < count; i++) {
      var a = Math.random() * U.TAU;
      var speed = 40 + Math.random() * 180;
      this.particles.push({
        x: x, y: y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
        life: 0.35 + Math.random() * 0.35, maxLife: 0.7,
        size: 1.5 + Math.random() * 2.5, color: Math.random() < 0.3 ? '#ffffff' : color
      });
    }
  };

  // 绘制当前画面。
  MarbleScene.prototype.render = function (ctx) {
    var g = this.geometry;
    var W = g.W, H = g.H;
    V.drawBackdrop(ctx, W, H, this.time, 'game');
    ctx.save();

    <script>
/* ---- src/scenes/studio.js ---- */
/* 指尖钢琴节奏 — 双人创作：同屏双人实时作曲对战 */
(function (root) {
  'use strict';
  var FP = root.FP = root.FP || {};
  var C = FP.C;
  var U = FP.U;
  var V = FP.Visuals;

  var PADS = [
    { color: '#48e9ff', pitch: 'C4' },
    { color: '#ff5ed0', pitch: 'E4' },
    { color: '#9a7bff', pitch: 'G4' },
    { color: '#ffb547', pitch: 'B4' }
  ];
  var STEP_MS = 300;

  // 执行「StudioScene」负责的逻辑。
  function StudioScene(game) {
    this.game = game;
    this.phase = 'countdown';
    this.countdown = 3.2;
    this.time = 0;
    this.songTime = 0;
    this.step = 0;
    this.lastStep = -1;
    this.players = [
      { name: 'P1', color: '#48e9ff', score: 0, combo: 0, maxCombo: 0, hits: 0, notes: [] },
      { name: 'P2', color: '#ff5ed0', score: 0, combo: 0, maxCombo: 0, hits: 0, notes: [] }
    ];
    this.geometry = null;
    this.resultLayout = null;
    this.best = 0;
    this.newBest = false;
    this.pressed = '';
    this.winner = '';
    this.harmony = 0;
  }

  // 进入场景：重置本局状态、布局和输入。
  StudioScene.prototype.enter = function () {
    var W = this.game.width, H = this.game.height;
    var safeTop = Math.max(this.game.platform.safeTop, 20);
    var safeBottom = this.game.platform.safeBottom;
    var top = safeTop + 126;
    var areaH = (H - top - safeBottom - 24) / 2;
    this.geometry = { W: W, H: H, safeTop: safeTop, safeBottom: safeBottom, top: top, areaH: areaH };
    this.p1 = { x: 28, y: top, w: W - 56, h: areaH - 8 };
    this.p2 = { x: 28, y: top + areaH + 12, w: W - 56, h: areaH - 8 };
    this.phase = 'countdown';
    this.countdown = 3.2;
    this.time = 0;
    this.songTime = 0;
    this.step = 0;
    this.lastStep = -1;
    this.players = [
      { name: 'P1', color: '#48e9ff', score: 0, combo: 0, maxCombo: 0, hits: 0, notes: [] },
      { name: 'P2', color: '#ff5ed0', score: 0, combo: 0, maxCombo: 0, hits: 0, notes: [] }
    ];
    this.winner = '';
    this.harmony = 0;
    this.pressed = '';
    this.best = FP.Social.getBest('studio');
    this.resultLayout = FP.ArcadeUI.layout(W, H, safeBottom);
    this.game.setInput(this.onStart.bind(this), null, this.onEnd.bind(this));
    this.game.audio.init();
    this.game.audio.startBgm(FP.Library.get('neon-heart'), 0);
  };

  // 离开场景：停止音频并清理输入。
  StudioScene.prototype.exit = function () { this.game.audio.stopBgm(true); };
  // 切到后台时暂停音频，避免后台继续播放。
  StudioScene.prototype.onHide = function () { this.game.audio.stopBgm(false); };

  // 触摸/鼠标按下回调。
  StudioScene.prototype.onStart = function (pts) {
    if (!pts || !pts.length) return;
    if (this.phase === 'result') {
      var p0 = pts[0];
      var L = this.resultLayout;
      if (U.pointInRect(p0.x, p0.y, L.retry)) this.retry();
      else if (U.pointInRect(p0.x, p0.y, L.back)) this.game.goTo('modes');
      return;
    }
    if (U.pointInRect(pts[0].x, pts[0].y, FP.ArcadeUI.backRect(this.game))) {
      this.game.goTo('modes');
      return;
    }
    if (this.phase !== 'playing') return;
    for (var i = 0; i < pts.length; i++) this.handlePoint(pts[i]);
  };

  // 触摸/鼠标结束回调。
  StudioScene.prototype.onEnd = function () {};

  // 处理一次玩家落点，更新对应半区的音符和比分。
  StudioScene.prototype.handlePoint = function (p) {
    var player = -1;
    var area = null;
    if (p.y >= this.p1.y && p.y <= this.p1.y + this.p1.h) { player = 0; area = this.p1; }
    else if (p.y >= this.p2.y && p.y <= this.p2.y + this.p2.h) { player = 1; area = this.p2; }
    if (player < 0) return;
    var padTop = area.y + area.h - 104;
    if (p.y < padTop - 4) return;
    var padW = area.w / 4;
    var lane = Math.floor((p.x - area.x) / padW);
    if (lane < 0) lane = 0;
    if (lane > 3) lane = 3;
    // nearest 8th-note step
    var nearest = Math.round(this.songTime / STEP_MS) * STEP_MS;
    var diff = Math.abs(this.songTime - nearest);
    var grade = diff <= 60 ? 'perfect' : (diff <= 120 ? 'great' : (diff <= 180 ? 'good' : 'off'));
    var gain = grade === 'perfect' ? 100 : (grade === 'great' ? 60 : (grade === 'good' ? 30 : 10));
    var step = ((Math.round(this.songTime / STEP_MS) % 8) + 8) % 8;
    var pl = this.players[player];
    if (!pl.notes[step]) pl.notes[step] = [0, 0, 0, 0];
    if (pl.notes[step][lane]) {
      this.game.audio.playNote(PADS[lane].pitch, 0.35);
      return;
    }
    pl.notes[step][lane] = 1;
    pl.score += gain;
    pl.hits++;
    pl.combo++;
    pl.maxCombo = Math.max(pl.maxCombo, pl.combo);
    this.game.audio.playNote(PADS[lane].pitch, 0.75);
    if (grade === 'perfect') this.game.audio.playSparkle();
    this.game.platform.haptic('light');
    this.spawnBurst(p.x, p.y, PADS[lane].color);
  };

  // 在指定位置生成粒子爆发。
  StudioScene.prototype.spawnBurst = function (x, y, color) {
    this.burst = this.burst || [];
    for (var i = 0; i < 8; i++) {
      var a = Math.random() * U.TAU;
      var s = 40 + Math.random() * 130;
      this.burst.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.35, maxLife: 0.35, color: color });
    }
  };

  // 每帧更新逻辑。
  StudioScene.prototype.update = function (dt) {
    this.time += dt;
    if (this.burst) {
      for (var i = this.burst.length - 1; i >= 0; i--) {
        var b = this.burst[i];
        b.life -= dt;
        if (b.life <= 0) { this.burst.splice(i, 1); continue; }
        b.vy += 300 * dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
      }
    }
    if (this.phase === 'countdown') {
      this.countdown -= dt;
      if (this.countdown <= 0) {
        this.phase = 'playing';
        this.songTime = 0;
        this.lastStep = -1;
      }
      return;
    }
    if (this.phase !== 'playing') return;
    this.songTime += dt * 1000;
    var step = Math.floor(this.songTime / STEP_MS) % 8;
    if (step !== this.lastStep) {
      this.lastStep = step;
      this.playStep(step);
    }
    if (this.songTime >= 45000) this.finish();
  };

  // 播放当前八分音符步进中两位玩家已放置的音符。
  StudioScene.prototype.playStep = function (step) {
    for (var p = 0; p < 2; p++) {
      var arr = this.players[p].notes[step];
      if (!arr) continue;
      for (var lane = 0; lane < 4; lane++) {
        if (arr[lane]) this.game.audio.playNote(PADS[lane].pitch, p === 0 ? 0.16 : 0.12);
      }
    }
  };

  // 重新开始本局，并重新扣除入场资源。
  StudioScene.prototype.retry = function () {
    if (!this.game.economy.canPlay('studio')) { this.game.goTo('modes'); return; }
    this.game.economy.spendForMode('studio');
    this.game.goTo('studio');
  };

  // 结束本局并写入结算数据。
  StudioScene.prototype.finish = function () {
    if (this.phase === 'result') return;
    this.phase = 'result';
    this.harmony = 0;
    for (var s = 0; s < 8; s++) {
      var a = this.players[0].notes[s], b = this.players[1].notes[s];
      if (a && b && a.some(Boolean) && b.some(Boolean)) this.harmony++;
    }
    if (this.harmony) {
      this.players[0].score += this.harmony * 10;
      this.players[1].score += this.harmony * 10;
    }
    this.winner = this.players[0].score === this.players[1].score ? '平局' : (this.players[0].score > this.players[1].score ? 'P1 胜' : 'P2 胜');
    this.newBest = FP.Social.submit('studio', Math.max(this.players[0].score, this.players[1].score));
    this.best = FP.Social.getBest('studio');
    this.game.audio.stopBgm(false);
    this.game.audio.playCoin();
    this.game.platform.haptic('light');
  };

  // 绘制当前画面。
  StudioScene.prototype.render = function (ctx) {
    var g = this.geometry;
    V.drawBackdrop(ctx, g.W, g.H, this.time, 'game');
    ctx.save();
    FP.ArcadeUI.drawBack(ctx, this.game);
    FP.ArcadeUI.drawTop(ctx, this.game, '双人创作', 'DUET STUDIO', C.COLORS.pink,
      this.phase === 'playing' ? (Math.ceil((45000 - this.songTime) / 1000) + 's') : '45s');
    this.drawPlayerArea(ctx, this.p1, 0);
    this.drawPlayerArea(ctx, this.p2, 1);

      ctx.globalCompositeOperation = 'lighter';
      for (var i = 0; i < this.burst.length; i++) {
        var b = this.burst[i];
        ctx.globalAlpha = b.life / b.maxLife;
        ctx.fillStyle = b.color;
        U.circle(ctx, b.x, b.y, 2.5);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
    if (this.phase === 'result') this.drawResult(ctx);
  };

  // 绘制「drawPlayerArea」相关界面/特效。
  StudioScene.prototype.drawPlayerArea = function (ctx, area, index) {
    var pl = this.players[index];
    var accent = pl.color;
    U.fillRoundRect(ctx, area.x, area.y, area.w, area.h, 24, 'rgba(8, 12, 28, 0.78)');
    U.strokeRoundRect(ctx, area.x, area.y, area.w, area.h, 24, U.rgba(accent, 0.2), 1);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    U.setFont(ctx, 10, 700);
    ctx.fillStyle = U.rgba(accent, 0.85);
    U.spacedText(ctx, index === 0 ? 'PLAYER 1  ·  TOP' : 'PLAYER 2  ·  BOTTOM', area.x + 18, area.y + 26, 1.8, 'left');
    ctx.textAlign = 'right';
    U.setFont(ctx, 28, 800, '"PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif');
    ctx.fillStyle = accent;
    ctx.fillText(U.formatScore(pl.score), area.x + area.w - 18, area.y + 36);
    U.setFont(ctx, 8, 600);
    ctx.fillStyle = 'rgba(144, 163, 205, 0.58)';
    ctx.fillText('SCORE', area.x + area.w - 18, area.y + 52);

    var gridX = area.x + 18;
    var gridY = area.y + 66;
    var gridW = area.w - 36;
    var gridH = Math.max(72, area.h * 0.24);
    var cellW = gridW / 8;

    for (var s = 0; s < 8; s++) {

      }

    U.strokeRoundRect(ctx, gridX, gridY, gridW, gridH, 8, 'rgba(146,168,230,0.1)', 1);

    var padTop = area.y + area.h - 102;
    var padW = area.w / 4;
    for (var p = 0; p < 4; p++) {
      U.fillRoundRect(ctx, area.x + p * padW + 5, padTop, padW - 10, 88, 14, U.rgba(PADS[p].color, 0.10));
      U.strokeRoundRect(ctx, area.x + p * padW + 5, padTop, padW - 10, 88, 14, U.rgba(PADS[p].color, 0.25), 1);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      U.setFont(ctx, 24, 800);
      ctx.fillStyle = U.rgba(PADS[p].color, 0.72);
      ctx.fillText(index === 0 ? 'ⅠⅡⅢⅣ'[p] : 'ⅠⅡⅢⅣ'[p], area.x + p * padW + padW / 2, padTop + 44);

  // 绘制「drawCenter」相关界面/特效。
  StudioScene.prototype.drawCenter = function (ctx) {

    { color: '#9a7bff', pitch: 'G4', label: 'Ⅲ' },
