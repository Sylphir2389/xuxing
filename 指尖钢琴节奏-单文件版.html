  <style>
:root {
  --ink: #05070f;
  --cyan: #48e9ff;
  --violet: #9a7bff;
  --pink: #ff5ed0;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #03050c;
  color: #f7f5ff;
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 0;
  user-select: none;
  touch-action: none;
}

.ambient {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 40%, rgba(15, 25, 58, 0.55), transparent 58%),
    linear-gradient(180deg, #02040b 0%, #050813 48%, #0b0618 100%);
}

.ambient .orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0.36;
  animation: drift 18s ease-in-out infinite alternate;
}

.orb-a {
  width: 42vmax;
  height: 42vmax;
  left: -12vmax;
  top: -10vmax;
  background: #0f7cff;
}

.orb-b {
  width: 34vmax;
  height: 34vmax;
  right: -10vmax;
  top: 20%;
  background: #b219ff;
  animation-delay: -6s;
}

.orb-c {
  width: 38vmax;
  height: 38vmax;
  left: 20%;
  bottom: -20vmax;
  background: #ff187e;
  opacity: 0.2;
  animation-delay: -11s;
}

.scan {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  inset: 0;
  opacity: 0.06;
  background-image: repeating-linear-gradient(
    0deg,
    rgba(255, 255, 255, 0.4) 0px,
    rgba(255, 255, 255, 0.4) 1px,
    transparent 1px,
    transparent 4px
  );
  mix-blend-mode: overlay;
}

@keyframes drift {
  from { transform: translate3d(0, 0, 0) scale(1); }
  to { transform: translate3d(4vmax, 3vmax, 0) scale(1.12); }
}

.stage {
  position: relative;
  width: min(100vw, calc(100vh * 9 / 16));
  height: min(100vh, calc(100vw * 16 / 9));
  width: min(100vw, calc(100dvh * 9 / 16));
  height: min(100dvh, calc(100vw * 16 / 9));
  aspect-ratio: 9 / 16;
  background: #05070f;
  box-shadow:
    0 0 0 1px rgba(123, 161, 255, 0.17),
    0 0 80px rgba(63, 151, 255, 0.14),
    0 32px 90px rgba(0, 0, 0, 0.66);
  overflow: hidden;
  isolation: isolate;
}

@media (min-width: 700px) and (min-height: 700px) {
  .stage {
    border-radius: 28px;
  }
}

#game {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  outline: none;
}

.toast {
  position: absolute;
  left: 50%;
  bottom: 8%;
  transform: translate(-50%, 16px);
  padding: 10px 18px;
  border-radius: 999px;
  background: rgba(10, 14, 34, 0.92);
  border: 1px solid rgba(150, 183, 255, 0.24);
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
  color: #dfe9ff;
  font-size: 13px;
  letter-spacing: 0.04em;
  opacity: 0;
  pointer-events: none;
  transition: opacity 180ms ease, transform 180ms ease;
  z-index: 4;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

.build-tag {
  position: fixed;
  left: 18px;
  bottom: 14px;
  color: rgba(144, 169, 219, 0.30);
  font-size: 9px;
  letter-spacing: 0.22em;
  font-weight: 600;
  pointer-events: none;
}

@media (max-width: 699px), (max-height: 699px) {
  .build-tag {
    display: none;
  }
}

  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
    <span class="scan"></span>
  </div>
  <main class="stage" id="stage">
    <canvas id="game" width="750" height="1334" aria-label="指尖钢琴节奏游戏画面"></canvas>
    <div class="toast" id="toast"></div>
  </main>

    <script>
/* ---- src/core/utils.js ---- */
/* 指尖钢琴节奏 — canvas / math helpers */
(function (root) {
  'use strict';
  var FP = root.FP = root.FP || {};

  var U = {};

  U.TAU = Math.PI * 2;
  // 执行「clamp」负责的逻辑。
  U.clamp = function (v, min, max) { return v < min ? min : (v > max ? max : v); };
  // 执行「lerp」负责的逻辑。
  U.lerp = function (a, b, t) { return a + (b - a) * t; };
  // 执行「invLerp」负责的逻辑。
  U.invLerp = function (a, b, v) { return b === a ? 0 : U.clamp((v - a) / (b - a), 0, 1); };
  // 执行「easeOutCubic」负责的逻辑。
  U.easeOutCubic = function (t) { t = U.clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); };
  // 执行「easeInCubic」负责的逻辑。
  U.easeInCubic = function (t) { t = U.clamp(t, 0, 1); return t * t * t; };
  // 执行「easeOutQuint」负责的逻辑。
  U.easeOutQuint = function (t) { t = U.clamp(t, 0, 1); return 1 - Math.pow(1 - t, 5); };
  // 执行「easeInOutCubic」负责的逻辑。
  U.easeInOutCubic = function (t) {
    t = U.clamp(t, 0, 1);
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  };
  // 执行「easeOutBack」负责的逻辑。
  U.easeOutBack = function (t) {
    t = U.clamp(t, 0, 1);
    var c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  };
  // 执行「pulse」负责的逻辑。
  U.pulse = function (t, speed) { return 0.5 + 0.5 * Math.sin(t * (speed || 1)); };
  // 执行「distance」负责的逻辑。
  U.distance = function (x1, y1, x2, y2) { return Math.sqrt((x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1)); };
  // 执行「pointInRect」负责的逻辑。
  U.pointInRect = function (x, y, r) {
    return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  };
  // 执行「pad2」负责的逻辑。
  U.pad2 = function (n) { return n < 10 ? '0' + n : '' + n; };
  // 格式化「formatScore」显示内容。
  U.formatScore = function (n) {
    n = Math.max(0, Math.floor(n || 0));
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  };
  // 格式化「formatTime」显示内容。
  U.formatTime = function (ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    return U.pad2(Math.floor(s / 60)) + ':' + U.pad2(s % 60);
  };
  // 格式化「formatDuration」显示内容。
  U.formatDuration = function (ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    return Math.floor(s / 60) + ':' + U.pad2(s % 60);
  };
  // 执行「mulColor」负责的逻辑。
  U.mulColor = function (hex, factor) {
    var c = U.hexToRgb(hex);
    return 'rgb(' + Math.round(U.clamp(c.r * factor, 0, 255)) + ',' +
      Math.round(U.clamp(c.g * factor, 0, 255)) + ',' +
      Math.round(U.clamp(c.b * factor, 0, 255)) + ')';
  };
  // 执行「hexToRgb」负责的逻辑。
  U.hexToRgb = function (hex) {
    var h = String(hex || '#ffffff').replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var num = parseInt(h, 16);
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  };
  // 执行「rgba」负责的逻辑。
  U.rgba = function (hex, alpha) {
    var c = U.hexToRgb(hex);
    return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + alpha + ')';
  };
  // 执行「mixHex」负责的逻辑。
  U.mixHex = function (a, b, t) {
    var ca = U.hexToRgb(a), cb = U.hexToRgb(b);
    var r = Math.round(U.lerp(ca.r, cb.r, t));
    var g = Math.round(U.lerp(ca.g, cb.g, t));
    var bl = Math.round(U.lerp(ca.b, cb.b, t));
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  };
  // 执行「roundRectPath」负责的逻辑。
  U.roundRectPath = function (ctx, x, y, w, h, r) {
    var rr = Math.min(typeof r === 'number' ? r : 0, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.lineTo(x + w - rr, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
    ctx.lineTo(x + w, y + h - rr);
    ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    ctx.lineTo(x + rr, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
    ctx.lineTo(x, y + rr);
    ctx.quadraticCurveTo(x, y, x + rr, y);
    ctx.closePath();
    return ctx;
  };
  // 执行「fillRoundRect」负责的逻辑。
  U.fillRoundRect = function (ctx, x, y, w, h, r, fill) {
    U.roundRectPath(ctx, x, y, w, h, r);
    ctx.fillStyle = fill;
    ctx.fill();
  };
  // 执行「strokeRoundRect」负责的逻辑。
  U.strokeRoundRect = function (ctx, x, y, w, h, r, stroke, lw) {
    U.roundRectPath(ctx, x, y, w, h, r);
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lw || 1;
    ctx.stroke();
  };
  // 执行「circle」负责的逻辑。
  U.circle = function (ctx, x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, Math.max(0, r), 0, U.TAU);
  };
  // 执行「fillCircle」负责的逻辑。
  U.fillCircle = function (ctx, x, y, r, fill) {
    U.circle(ctx, x, y, r);
    ctx.fillStyle = fill;
    ctx.fill();
  };
  // 执行「strokeCircle」负责的逻辑。
  U.strokeCircle = function (ctx, x, y, r, stroke, lw) {
    U.circle(ctx, x, y, r);
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lw || 1;
    ctx.stroke();
  };
  // 执行「withAlpha」负责的逻辑。
  U.withAlpha = function (ctx, alpha, draw) {
    var old = ctx.globalAlpha;
    ctx.globalAlpha = old * alpha;
    draw();
    ctx.globalAlpha = old;
  };
  // 设置「setFont」状态。
  U.setFont = function (ctx, size, weight, family) {
    ctx.font = (weight || 400) + ' ' + size + 'px ' + (family || '"PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif');
  };
  // 执行「spacedText」负责的逻辑。
  U.spacedText = function (ctx, text, x, y, spacing, align) {
    var chars = String(text).split('');
    var total = 0;
    var i;
    var oldAlign = ctx.textAlign;
    for (i = 0; i < chars.length; i++) total += ctx.measureText(chars[i]).width + (i < chars.length - 1 ? spacing : 0);
    var startX = x;
    if (align === 'center') startX = x - total / 2;
    else if (align === 'right') startX = x - total;
    ctx.textAlign = 'left';
    for (i = 0; i < chars.length; i++) {
      ctx.fillText(chars[i], startX, y);
      startX += ctx.measureText(chars[i]).width + spacing;
    }
    ctx.textAlign = oldAlign;
    return total;
  };
  // 执行「truncateText」负责的逻辑。
  U.truncateText = function (ctx, text, maxWidth) {
    if (ctx.measureText(text).width <= maxWidth) return text;
    var t = text;
    while (t.length > 1 && ctx.measureText(t + '…').width > maxWidth) t = t.slice(0, -1);
    return t + '…';
  };
  // 执行「linear」负责的逻辑。
  U.linear = function (ctx, x0, y0, x1, y1, stops) {
    var g = ctx.createLinearGradient(x0, y0, x1, y1);
    for (var i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
    return g;
  };
  // 执行「radial」负责的逻辑。
  U.radial = function (ctx, x, y, r0, r1, stops) {
    var g = ctx.createRadialGradient(x, y, r0, x, y, r1);
    for (var i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
    return g;
  };

  // 绘制「drawStar」相关界面/特效。
  U.drawStar = function (ctx, cx, cy, outer, inner, points, fill, stroke) {
    var n = points || 5;
    ctx.beginPath();
    for (var i = 0; i < n * 2; i++) {
      var r = i % 2 === 0 ? outer : inner;
      var a = -Math.PI / 2 + i * Math.PI / n;
      var x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
  };

  // 绘制「drawHeart」相关界面/特效。
  U.drawHeart = function (ctx, cx, cy, size, fill, stroke) {
    var s = size / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy + s * 0.85);
    ctx.bezierCurveTo(cx - s * 1.5, cy - s * 0.18, cx - s * 0.95, cy - s * 1.05, cx, cy - s * 0.36);
    ctx.bezierCurveTo(cx + s * 0.95, cy - s * 1.05, cx + s * 1.5, cy - s * 0.18, cx, cy + s * 0.85);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
  };

  // 绘制「drawNote」相关界面/特效。
  U.drawNote = function (ctx, cx, cy, size, color, alpha) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(size / 34, size / 34);
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.fillStyle = color || '#ffffff';
    ctx.strokeStyle = color || '#ffffff';
    ctx.lineWidth = 3.2;
    ctx.lineCap = 'round';
    // head
    ctx.save();
    ctx.translate(-4, 10);
    ctx.rotate(-0.35);
    ctx.scale(1, 0.7);
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, U.TAU);
    ctx.fill();
    ctx.restore();
    // stem
    ctx.beginPath();
    ctx.moveTo(4.8, 8);
    ctx.lineTo(4.8, -14);
    ctx.stroke();
    // flag
    ctx.beginPath();
    ctx.moveTo(4.8, -14);
    ctx.quadraticCurveTo(17, -12, 16, 1);
    ctx.quadraticCurveTo(12, -6, 4.8, -4);
    ctx.fill();
    ctx.restore();
  };

  // 绘制「drawPlay」相关界面/特效。
  U.drawPlay = function (ctx, cx, cy, size, color) {
    ctx.beginPath();
    ctx.moveTo(cx - size * 0.33, cy - size * 0.48);
    ctx.lineTo(cx + size * 0.52, cy);
    ctx.lineTo(cx - size * 0.33, cy + size * 0.48);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  };

  // 绘制「drawPause」相关界面/特效。
  U.drawPause = function (ctx, cx, cy, size, color) {
    var w = size * 0.17, h = size * 0.86, gap = size * 0.2;
    U.fillRoundRect(ctx, cx - gap - w, cy - h / 2, w, h, w / 2, color);
    U.fillRoundRect(ctx, cx + gap, cy - h / 2, w, h, w / 2, color);
  };

  // 绘制「drawSound」相关界面/特效。
  U.drawSound = function (ctx, cx, cy, size, color, muted) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = Math.max(2, size * 0.075);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    var s = size * 0.5;
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.8, cy - s * 0.28);
    ctx.lineTo(cx - s * 0.42, cy - s * 0.28);
    ctx.lineTo(cx + s * 0.04, cy - s * 0.68);
    ctx.lineTo(cx + s * 0.04, cy + s * 0.68);
    ctx.lineTo(cx - s * 0.42, cy + s * 0.28);
    ctx.lineTo(cx - s * 0.8, cy + s * 0.28);
    ctx.closePath();
    ctx.fill();
    if (muted) {
      ctx.beginPath();
      ctx.moveTo(cx + s * 0.36, cy - s * 0.22);
      ctx.lineTo(cx + s * 0.84, cy + s * 0.26);
      ctx.moveTo(cx + s * 0.84, cy - s * 0.22);
      ctx.lineTo(cx + s * 0.36, cy + s * 0.26);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(cx + s * 0.08, cy, s * 0.38, -0.85, 0.85);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx + s * 0.08, cy, s * 0.72, -0.82, 0.82);
      ctx.stroke();
    }
    ctx.restore();
  };

  // 绘制「drawBack」相关界面/特效。
  U.drawBack = function (ctx, cx, cy, size, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(2, size * 0.09);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(cx + size * 0.22, cy - size * 0.42);
    ctx.lineTo(cx - size * 0.22, cy);
    ctx.lineTo(cx + size * 0.22, cy + size * 0.42);
    ctx.stroke();
    ctx.restore();
  };

  // 绘制「drawChevron」相关界面/特效。
  U.drawChevron = function (ctx, cx, cy, size, color, dir) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(2, size * 0.12);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

(function (root) {
  'use strict';
  var FP = root.FP = root.FP || {};
  var C = FP.C;

  var MODES = {
    easy: {
      id: 'easy', name: '简单', en: 'EASY', level: 1,
      color: '#63ffd2', accent: '#48e9ff',

      desc: '蓝条长按 · 双押与快速交替'
    },
    hell: {
      id: 'hell', name: '地狱', en: 'HELL', level: 3,
      color: '#ff5ed0', accent: '#ffb547',
      health: 2, speedScale: 1.24, tag: '极限密度',
      desc: '长条与三押 · 2 格生命'
    },
    endless: {
      id: 'endless', name: '无尽', en: 'ENDLESS', level: 4,
      color: '#ffb547', accent: '#ff5ed0',
      health: 2, speedScale: 1.0, tag: '无限波次',
      desc: '速度递增 · 生存挑战'
    }
  };

  var ORDER = ['easy', 'hard', 'hell', 'endless'];

  var Modes = {
    order: ORDER,
    defs: MODES,
    // 执行「list」负责的逻辑。
    list: function () {

    },
    // 获取「get」数据。
    get: function (id) {
      return MODES[id] || MODES.hard;
    },
    // 执行「cost」负责的逻辑。
    cost: function (id) {
      return FP.Config.economy.modeCost[id] || 1;
    },
    // 构建「buildSong」数据/谱面。
    buildSong: function (baseSong, modeId) {

  // 给经典谱面按难度加入蓝色长按条；保持原音符数量和排序不变。
  function applyHolds(notes, modeId, playEnd) {
    var every = modeId === 'easy' ? 8 : (modeId === 'hell' ? 5 : 6);
    var maxHold = modeId === 'easy' ? 720 : (modeId === 'hell' ? 880 : 820);

      if (n.t < lastEnd[lane] + 160) continue;
      var next = null;

  function sectionAt(sections, t) {

        var n = g.notes[j];
        out.push({ t: n.t, lane: n.lane, type: 'tap', pitch: n.pitch, accent: !!n.accent });
      }
      // 在地狱模式里给每组单键补一个反拍音，制造连续交替的压力。
      if (i % 3 === 0 && g.notes.length < 3) {
        var sec = sectionAt(baseSong.sections, g.t);
        if (sec.name === 'intro') continue;
        var t = g.t + 267;
        if (t > baseSong.playEnd - 140) continue;
        var candidates = [0, 1, 2, 3].filter(function (lane) {
          if (lane === g.notes[0].lane) return false;
          for (var k = 0; k < out.length; k++) {

          }
          return true;
        });
        if (!candidates.length) continue;
        var lane = candidates[(i * 7 + g.t) % candidates.length];
        var pitch = C.NOTE_NAMES[(i + lane * 2) % C.NOTE_NAMES.length];
        out.push({ t: t, lane: lane, type: 'tap', pitch: pitch, accent: false });
      }
    }

  }

  function statsFor(notes, sections) {

    var byTime = {};
    var maxChord = 0;
    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      var s = sectionAt(sections, n.t);
      if (s && counts[s.name] != null) counts[s.name]++;

      if (byTime[n.t] > maxChord) maxChord = byTime[n.t];
    }

      maxChord: maxChord,

    <script>
/* ---- src/services/economy.js ---- */
/* 指尖钢琴节奏 — 本地经济系统：体力、钻石、每日领取、充值入口 */
(function (root) {
  'use strict';
  var FP = root.FP = root.FP || {};
  var C = FP.Config;

  // 执行「dateKey」负责的逻辑。
  function dateKey(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }

  // 执行「Economy」负责的逻辑。
  function Economy(payments) {
    this.storage = FP.Platform.storage;
    this.payments = payments || (FP.Payments ? new FP.Payments() : null);
    this.cfg = C.economy;
    this.KEY = 'fp.economy.v2';
    this.state = null;
    this.load();
  }

  // 执行「defaults」负责的逻辑。
  Economy.prototype.defaults = function () {
    return {
      diamonds: this.cfg.startDiamonds,
      stamina: this.cfg.startStamina,
      staminaAnchor: Date.now(),
      lastDaily: '',
      ownedTrails: ['default'],
      selectedTrail: 'default'
    };
  };

  // 从本地存储加载持久化数据。
  Economy.prototype.load = function () {
    var s = this.storage.get(this.KEY, null);
    if (!s || typeof s !== 'object') s = this.defaults();
    s.diamonds = Math.max(0, parseInt(s.diamonds, 10) || 0);
    s.stamina = Math.max(0, parseInt(s.stamina, 10) || 0);
    s.staminaAnchor = parseInt(s.staminaAnchor, 10) || Date.now();
    s.lastDaily = s.lastDaily || '';
    s.ownedTrails = Array.isArray(s.ownedTrails) ? s.ownedTrails : ['default'];
    if (s.ownedTrails.indexOf('default') < 0) s.ownedTrails.unshift('default');
    s.selectedTrail = s.selectedTrail || 'default';
    if (s.ownedTrails.indexOf(s.selectedTrail) < 0) s.selectedTrail = 'default';
    this.state = s;
    this.refresh(true);
    if (this.state.stamina >= this.cfg.maxStamina) {
      this.state.stamina = this.cfg.maxStamina;
      this.state.staminaAnchor = Date.now();
    }
    this.save();
  };

  // 将当前状态写入本地存储。
  Economy.prototype.save = function () {
    this.storage.set(this.KEY, this.state);
  };

  // 刷新时间、派生数据和界面缓存。
  Economy.prototype.refresh = function (silent) {
    var now = Date.now();
    var s = this.state;
    if (s.stamina >= this.cfg.maxStamina) {
      s.stamina = this.cfg.maxStamina;
      s.staminaAnchor = now;
      return false;
    }
    var elapsed = now - s.staminaAnchor;
    if (elapsed >= this.cfg.staminaRegenMs) {
      var gain = Math.floor(elapsed / this.cfg.staminaRegenMs);
      var before = s.stamina;
      s.stamina = Math.min(this.cfg.maxStamina, s.stamina + gain);
      s.staminaAnchor += gain * this.cfg.staminaRegenMs;
      if (s.stamina >= this.cfg.maxStamina) s.staminaAnchor = now;
      if (s.stamina !== before) {
        if (!silent) this.save();
        return true;
      }
    }
    return false;
  };

  // 获取「get」数据。
  Economy.prototype.get = function () {
    this.refresh();
    return {
      diamonds: this.state.diamonds,
      stars: this.state.diamonds,
      stamina: this.state.stamina,
      tickets: this.state.stamina,
      maxStamina: this.cfg.maxStamina,
      staminaText: this.state.stamina + '/' + this.cfg.maxStamina,
      nextStaminaMs: this.nextStaminaMs(),
      dailyAvailable: this.isDailyAvailable(),
      selectedTrail: this.state.selectedTrail,
      ownedTrails: this.state.ownedTrails.slice()
    };
  };

  // 判断「isDailyAvailable」条件。
  Economy.prototype.isDailyAvailable = function () {
    return this.state.lastDaily !== dateKey();
  };

  // 执行「nextStaminaMs」负责的逻辑。
  Economy.prototype.nextStaminaMs = function () {
    if (this.state.stamina >= this.cfg.maxStamina) return 0;
    return Math.max(0, this.cfg.staminaRegenMs - (Date.now() - this.state.staminaAnchor));
  };

  // 执行「regenLabel」负责的逻辑。
  Economy.prototype.regenLabel = function () {
    var ms = this.nextStaminaMs();
    if (ms <= 0) return '体力已满';
    var sec = Math.ceil(ms / 1000);
    return Math.floor(sec / 60) + ':' + (sec % 60 < 10 ? '0' : '') + (sec % 60);
  };

  // 执行「modeCost」负责的逻辑。
  Economy.prototype.modeCost = function (mode) {
    return this.cfg.modeCost[mode] || 1;
  };

  // 判断是否允许「canPlay」操作。
  Economy.prototype.canPlay = function (mode) {
    this.refresh();
    return this.state.stamina >= this.modeCost(mode);
  };

  // 执行「spendForMode」负责的逻辑。
  Economy.prototype.spendForMode = function (mode) {
    this.refresh();
    var cost = this.modeCost(mode);
    if (this.state.stamina < cost) return false;
    var wasFull = this.state.stamina >= this.cfg.maxStamina;
    this.state.stamina -= cost;
    if (wasFull) this.state.staminaAnchor = Date.now();
    this.save();
    return true;
  };

  // 添加「addStamina」。（仅供回归测试与活动补发使用）
  Economy.prototype.addStamina = function (n) {
    this.refresh();
    var wasFull = this.state.stamina >= this.cfg.maxStamina;
    this.state.stamina = Math.min(this.cfg.maxStamina, this.state.stamina + Math.max(0, n || 0));
    if (wasFull || this.state.stamina >= this.cfg.maxStamina) this.state.staminaAnchor = Date.now();

  // 领取每日补给：增加节拍券和星钻，并记录领取日期。
  Economy.prototype.claimDaily = function () {
    if (!this.isDailyAvailable()) return { success: false, tickets: 0, stars: 0, reason: 'claimed' };
    var tickets = this.cfg.dailyTickets;
    var stars = this.cfg.dailyStars;
    this.state.stamina = Math.min(this.cfg.maxStamina, this.state.stamina + tickets);
    this.state.diamonds += stars;
    this.state.lastDaily = dateKey();
    this.save();
    return { success: true, tickets: tickets, stars: stars };

  // 计算「computeModal」结果。
  SelectScene.prototype.computeModal = function () {
    var W = this.layout.W, H = this.layout.H;
    var w = Math.min(670, W - 72);
    var h = Math.min(800, H - this.layout.safeTop - this.layout.safeBottom - 100);
    var x = (W - w) / 2;
    var y = (H - h) / 2;
    this.shop = { x: x, y: y, w: w, h: h };
    this.modalRects = [];
    this.closeRect = { x: x + w - 58, y: y + 26, w: 34, h: 34 };
    this.dailyRect = { x: x + 28, y: y + 98, w: w - 56, h: 118 };
    this.dailyButton = { x: x + w - 56 - 118, y: y + 130, w: 118, h: 52 };
    var trails = FP.Config.economy.trails;
    var tw = (w - 56 - 24) / 4;
    this.trailRects = [];
    for (var t = 0; t < trails.length; t++) {
      this.trailRects.push({
        x: x + 28 + t * (tw + 8), y: y + 304, w: tw, h: 96,
        trail: trails[t]
      });
    }
    var packs = FP.Config.payments.packs;
    this.packRects = [];
    for (var i = 0; i < packs.length; i++) {
      this.packRects.push({
        x: x + 28, y: y + 438 + i * 100, w: w - 56, h: 84,
        pack: packs[i],
        buy: { x: x + w - 56 - 108, y: y + 456 + i * 100, w: 108, h: 48 }
      });
    }
  };

  // 每帧更新逻辑。
  SelectScene.prototype.update = function (dt) {
    this.time += dt;
    this.entry = Math.min(1, this.entry + dt * 2.2);
    this.claimFx = Math.max(0, this.claimFx - dt);
    if (this.toastTimer > 0) this.toastTimer -= dt;
    if (!this.dragging && Math.abs(this.scrollVelocity) > 1) {
      this.scrollY += this.scrollVelocity * dt;
      this.scrollVelocity *= Math.pow(0.02, dt);
      var L = this.layout;
      var maxScroll = Math.max(0, this.contentHeight - (L.listBottom - L.listTop));
      if (this.scrollY < 0) { this.scrollY = 0; this.scrollVelocity = 0; }
      else if (this.scrollY > maxScroll) { this.scrollY = maxScroll; this.scrollVelocity = 0; }
      this.rebuildCards();
    }
    if (this.time % 1 < dt) this.refreshWallet();
    if (this.modal === 'shop') this.refreshWallet();
  };

  // 触摸/鼠标按下回调。
  SelectScene.prototype.onStart = function (pts) {
    if (!pts || !pts.length) return;
    var p = pts[0];
    this.startPoint = p;
    if (this.modal === 'shop') {
      this.handleShopStart(p);
      return;
    }
    this.ignoreTap = false;
    if (U.pointInRect(p.x, p.y, this.rankRect)) {
      this.ignoreTap = true;
      FP.Platform.closeSearch(true);
      this.searchActive = false;
      this.game.audio.playUi('tap');
      this.game.goTo('modes', { openLeaderboard: true });
      return;
    }
    if (U.pointInRect(p.x, p.y, this.soundRect)) {
      this.ignoreTap = true;
      var muted = this.game.audio.toggleMute();
      if (!muted) this.game.audio.playUi('tap');
      this.showToast(muted ? '已静音' : '声音已开启', 1.1);
      return;
    }
    if (U.pointInRect(p.x, p.y, this.giftRect)) {
      this.ignoreTap = true;
      this.handleGiftTap();
      return;
    }
    if (U.pointInRect(p.x, p.y, this.diamondRect) || U.pointInRect(p.x, p.y, this.staminaRect)) {
      this.ignoreTap = true;
      this.openShop();
      return;
    }
    if (U.pointInRect(p.x, p.y, this.searchRect)) {
      this.ignoreTap = true;
      if (this.searchQuery && p.x > this.searchRect.x + this.searchRect.w - 42) {
        this.clearSearch();
      } else {
        this.openSearch();
      }
      return;
    }
    if (U.pointInRect(p.x, p.y, this.arcadeRect)) {
      this.ignoreTap = true;
      FP.Platform.closeSearch(true);
      this.searchActive = false;
      this.game.audio.playUi('start');
      this.game.goTo('modes');
      return;
    }
    for (var m = 0; m < this.modeRects.length; m++) {
      if (U.pointInRect(p.x, p.y, this.modeRects[m])) {
        this.ignoreTap = true;
        this.setMode(this.modeRects[m].id);
        return;
      }
    }
    var L = this.layout;
    if (p.y >= L.listTop - 4 && p.y <= L.listBottom) {
      this.dragging = false;
      this.dragStartY = p.y;
      this.scrollStartY = this.scrollY;
      this.lastDragY = p.y;
      this.scrollVelocity = 0;
      this.pressIndex = -1;
      for (var i = 0; i < this.cardRects.length; i++) {
        var r = this.cardRects[i];
        if (r.y + r.h < L.listTop || r.y > L.listBottom) continue;
        if (U.pointInRect(p.x, p.y, r)) {
          this.pressIndex = i;
          break;
        }
      }
      return;
    }
    this.pressIndex = -1;
  };

  // 触摸/鼠标移动回调。
  SelectScene.prototype.onMove = function (pts) {
    if (!pts || !pts.length || !this.startPoint) return;
    if (this.modal || this.ignoreTap) return;
    var p = pts[0];
    var L = this.layout;
    if (p.y >= L.listTop - 8 && (this.pressIndex >= 0 || this.dragging || p.y <= L.listBottom)) {
      var dy = p.y - this.dragStartY;
      if (Math.abs(dy) > 7) {
        this.dragging = true;
        this.pressIndex = -1;
        var maxScroll = Math.max(0, this.contentHeight - (L.listBottom - L.listTop));
        this.scrollY = U.clamp(this.scrollStartY - dy, 0, maxScroll);
        if (this.lastDragY != null) {
          this.scrollVelocity = U.clamp(-(p.y - this.lastDragY) * 9, -1400, 1400);
        }
        this.lastDragY = p.y;
        this.rebuildCards();
      }
    }
  };

  // 触摸/鼠标结束回调。
  SelectScene.prototype.onEnd = function () {
    if (this.ignoreTap) {
      this.ignoreTap = false;
      this.pressIndex = -1;
      this.startPoint = null;
      this.dragging = false;
      return;
    }
    if (this.dragging) {
      this.dragging = false;
      this.pressIndex = -1;
      this.startPoint = null;
      return;
    }
    if (this.pressIndex >= 0 && this.pressIndex < this.filteredSongs.length) {
      var song = this.filteredSongs[this.pressIndex];
      this.pressIndex = -1;
      this.startPoint = null;
      this.startSong(song);
      return;
    }
    this.pressIndex = -1;
    this.startPoint = null;
  };

  // 设置「setMode」状态。
  SelectScene.prototype.setMode = function (id) {
    if (this.modeId === id) return;
    this.modeId = id;
    FP.Platform.storage.set(MODE_STORE, id);
    FP.Platform.closeSearch(true);
    this.searchActive = false;
    this.game.audio.playUi('tap');
    this.game.platform.haptic('light');
    this.pressIndex = -1;
  };

  // 启动「startSong」流程。
  SelectScene.prototype.startSong = function (song) {
    var mode = this.mode();
    FP.Platform.closeSearch(true);
    this.searchActive = false;
    if (!this.game.economy.canPlay(mode.id)) {
      this.openShop();
      this.showToast('节拍券不足 · 先领取每日补给');
      return;
    }
    if (!this.game.economy.spendForMode(mode.id)) {
      this.openShop();
      return;
    }
    this.game.audio.init();
    this.game.audio.playUi('start');
    this.game.platform.haptic('light');
    this.refreshWallet();
    this.game.goTo('game', { songId: song.id, mode: mode.id });
  };

  // 打开「openShop」。
  SelectScene.prototype.openShop = function () {
    FP.Platform.closeSearch(true);
    this.searchActive = false;
    this.modal = 'shop';
    this.game.audio.playUi('tap');
    this.refreshWallet();
  };

  // 关闭「closeShop」。
  SelectScene.prototype.closeShop = function () {
    this.modal = null;
    this.game.audio.playUi('back');
  };

  // 处理「handleGiftTap」对应的交互/业务逻辑。
  SelectScene.prototype.handleGiftTap = function () {
    var res = this.game.economy.claimDaily();
    if (res.success) {
      this.claimFx = 1.2;
      this.game.audio.playCoin();
      this.game.platform.haptic('light');
      this.showToast('每日补给 +' + res.tickets + ' 节拍券 +' + res.stars + ' 星钻');
      this.refreshWallet();
    } else {
      this.openShop();
    }
  };

  // 处理「handleShopStart」对应的交互/业务逻辑。
  SelectScene.prototype.handleShopStart = function (p) {
    if (U.pointInRect(p.x, p.y, this.closeRect)) {
      this.closeShop();
      return;
    }
    if (!U.pointInRect(p.x, p.y, this.shop)) {
      this.closeShop();
      return;
    }
    if (U.pointInRect(p.x, p.y, this.dailyButton) && this.wallet.dailyAvailable) {
      var r = this.game.economy.claimDaily();
      if (r.success) {
        this.game.audio.playCoin();
        this.showToast('领取成功 +' + r.tickets + ' 节拍券 +' + r.stars + ' 星钻');
        this.claimFx = 1.2;
        this.refreshWallet();
      }
      return;
    }
    for (var t = 0; t < this.trailRects.length; t++) {
      var tr = this.trailRects[t];
      if (U.pointInRect(p.x, p.y, tr)) {
        var res = this.game.economy.buyTrail(tr.trail.id);
        if (res.success) {
          this.game.audio.playCoin();
          this.showToast(res.cost ? ('已解锁并装备 · ' + tr.trail.name) : ('已装备 · ' + tr.trail.name));
          this.refreshWallet();
        } else {
          this.showToast('星钻不足');
        }
        return;
      }
    }
    for (var i = 0; i < this.packRects.length; i++) {
      var pr = this.packRects[i];
      if (U.pointInRect(p.x, p.y, pr.buy)) {
        this.buyPack(pr.pack);
        return;
      }
    }
  };

  // 执行「buyPack」负责的逻辑。
  SelectScene.prototype.buyPack = function (pack) {
    if (this.purchasing) return;
    this.purchasing = true;
    var self = this;
    this.showToast('正在拉起' + (this.game.payments.isMock() ? '测试支付' : '支付') + '…', 1.2);
    this.game.economy.purchasePack(pack.id).then(function (res) {
      self.purchasing = false;
      if (res.success) {
        self.game.audio.playCoin();
        self.game.platform.haptic('light');
        self.showToast('充值成功 +' + pack.diamonds + ' 星钻');
        self.refreshWallet();
      } else {
        self.showToast('支付通道未配置');
      }
    }).catch(function () {
      self.purchasing = false;
      self.showToast('支付失败，请稍后再试');
    });
  };

  /* ---------- render ---------- */

  SelectScene.prototype.render = function (ctx) {
    var L = this.layout;
    var W = L.W, H = L.H;
    V.drawBackdrop(ctx, W, H, this.time, 'select');

    this.drawHeader(ctx);
    this.drawChapter(ctx);
    this.drawSearchBar(ctx);
    this.drawModeTabs(ctx);

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, L.listTop - 6, W, L.listBottom - L.listTop + 12);
    ctx.clip();
    for (var i = 0; i < this.cardRects.length; i++) {
      var r = this.cardRects[i];
      if (r.y + r.h < L.listTop - 8 || r.y > L.listBottom + 8) continue;
      this.drawCard(ctx, r.song, r, i);
    }
    ctx.restore();
    this.drawScrollbar(ctx);
    if (!this.filteredSongs.length) this.drawEmpty(ctx);
    this.drawArcadeButton(ctx);
    this.drawFooter(ctx);

    if (this.modal === 'shop') this.drawShop(ctx);
    this.drawToast(ctx);
  };

  // 绘制「drawHeader」相关界面/特效。
  SelectScene.prototype.drawHeader = function (ctx) {
    var L = this.layout;
    var top = L.top;
    var W = L.W;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    U.setFont(ctx, 10, 700);
    ctx.fillStyle = 'rgba(140, 174, 235, 0.62)';
    U.spacedText(ctx, 'FINGERTIP RHYTHM  /  SEASON 02', 36, top + 9, 2.5, 'left');

    // profile
    var ax = 36, ay = top + 22, ar = 18;
    ctx.save();
    ctx.shadowColor = 'rgba(72,233,255,0.4)';
    ctx.shadowBlur = 14;
    U.fillCircle(ctx, ax + ar, ay + ar, ar, 'rgba(18, 30, 66, 0.9)');
    ctx.shadowBlur = 0;
    U.strokeCircle(ctx, ax + ar, ay + ar, ar, 'rgba(102, 213, 255, 0.45)', 1.2);
    U.setFont(ctx, 14, 800);
    ctx.fillStyle = '#dff7ff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('指', ax + ar, ay + ar + 1);
    ctx.restore();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    U.setFont(ctx, 10, 700);
    ctx.fillStyle = C.COLORS.gold;
    ctx.fillText('好友榜 ›', 80, top + 33);
    U.setFont(ctx, 11, 600);
    ctx.fillStyle = 'rgba(214, 225, 255, 0.9)';
    ctx.fillText('PLAYER_01', 80, top + 49);
    U.setFont(ctx, 9, 500);
    ctx.fillStyle = 'rgba(149, 177, 228, 0.62)';
    ctx.fillText('LV.01', 158, top + 49);

    // wallet
    this.drawWallet(ctx);
    // mute
    V.drawIconButton(ctx, this.soundRect.cx, this.soundRect.cy, this.soundRect.r, {
      icon: 'sound', muted: this.game.audio.muted,
      fill: 'rgba(12, 18, 42, 0.7)',
      stroke: 'rgba(141, 170, 235, 0.18)'
    });

    // logo/title
    V.drawLogoMark(ctx, 36, top + 58, 44, this.time);
    var tg = U.linear(ctx, 92, 0, 430, 0, [
      [0, '#ffffff'],
      [0.45, '#e9f5ff'],
      [1, '#b7a8ff']
    ]);
    ctx.shadowColor = 'rgba(91, 199, 255, 0.28)';
    ctx.shadowBlur = 18;
    U.setFont(ctx, 46, 800);
    ctx.fillStyle = tg;
    ctx.fillText('指尖钢琴', 92, top + 96);
    ctx.shadowBlur = 0;
    U.setFont(ctx, 9, 600);
    ctx.fillStyle = 'rgba(166, 187, 232, 0.55)';
    U.spacedText(ctx, 'EVERY TOUCH LANDS ON THE BEAT', 95, top + 122, 2.4, 'left');
  };

  // 绘制「drawWallet」相关界面/特效。
  SelectScene.prototype.drawWallet = function (ctx) {
    var w = this.wallet;
    var d = this.diamondRect;
    var s = this.staminaRect;
    drawPill(ctx, d, U.rgba('#48e9ff', 0.10), U.rgba('#48e9ff', 0.28));
    drawDiamond(ctx, d.x + 20, d.y + d.h / 2, 9, '#78f4ff');
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    U.setFont(ctx, 13, 800);
    ctx.fillStyle = '#eafcff';
    ctx.fillText(String(w.diamonds), d.x + 34, d.y + d.h / 2 + 1);
    U.fillCircle(ctx, d.x + d.w - 17, d.y + d.h / 2, 9, 'rgba(72,233,255,0.16)');
    ctx.textAlign = 'center';
    U.setFont(ctx, 15, 700);
    ctx.fillStyle = '#8df7ff';
    ctx.fillText('+', d.x + d.w - 17, d.y + d.h / 2 + 1);

    drawPill(ctx, s, U.rgba('#ffb547', 0.09), U.rgba('#ffb547', 0.26));
    drawBolt(ctx, s.x + 18, s.y + s.h / 2, 10, '#ffcf6b');
    ctx.textAlign = 'left';
    U.setFont(ctx, 12, 800);
    ctx.fillStyle = '#fff2d2';
    ctx.fillText(w.stamina + '/' + w.maxStamina, s.x + 32, s.y + s.h / 2 + 1);
    U.setFont(ctx, 8, 600);
    ctx.fillStyle = 'rgba(255, 207, 107, 0.56)';
    ctx.fillText(w.nextStaminaMs > 0 ? this.game.economy.regenLabel() : 'FULL', s.x + 78, s.y + s.h / 2 + 2);

    var g = this.giftRect;
    U.fillCircle(ctx, g.x + g.r, g.y + g.r, g.r, 'rgba(255, 196, 86, 0.10)');
    U.strokeCircle(ctx, g.x + g.r, g.y + g.r, g.r, 'rgba(255, 196, 86, 0.34)', 1);
    drawGift(ctx, g.x + g.r, g.y + g.r, 10, '#ffd875');
    if (w.dailyAvailable) {
      var pulse = 0.7 + 0.3 * Math.sin(this.time * 5);
      ctx.globalAlpha = pulse;
      U.fillCircle(ctx, g.x + g.r + 11, g.y + 6, 4, C.COLORS.red);
      ctx.globalAlpha = 1;
    }
    if (this.claimFx > 0) {
      ctx.globalAlpha = Math.min(1, this.claimFx);
      ctx.textAlign = 'center';
      U.setFont(ctx, 16, 800);
      ctx.fillStyle = C.COLORS.gold;
      ctx.fillText('+' + FP.Config.economy.dailyStars, d.x + d.w / 2, d.y - 10 - (1 - this.claimFx) * 26);
      ctx.globalAlpha = 1;
    }
  };

  // 绘制「drawChapter」相关界面/特效。
  SelectScene.prototype.drawChapter = function (ctx) {
    var L = this.layout;
    var x = 36, y = L.chapterY, w = L.W - 72, h = 50;
    U.drawGlassPanel(ctx, x, y, w, h, 18, {
      top: 'rgba(22, 29, 63, 0.82)',
      bottom: 'rgba(10, 14, 33, 0.9)',
      border: 'rgba(140, 174, 255, 0.15)'
    });
    U.fillRoundRect(ctx, x + 16, y + 11, 4, 28, 2, C.COLORS.cyan);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    U.setFont(ctx, 9, 700);
    ctx.fillStyle = 'rgba(135, 170, 232, 0.68)';
    U.spacedText(ctx, 'MUSIC LIBRARY', x + 30, y + 16, 1.8, 'left');
    U.setFont(ctx, 19, 800);
    ctx.fillStyle = '#f4f2ff';
    ctx.fillText('全曲库', x + 30, y + 35);
    ctx.textAlign = 'right';
    U.setFont(ctx, 9, 600);
    ctx.fillStyle = 'rgba(145, 166, 214, 0.66)';
    U.spacedText(ctx, this.songs.length + ' TRACKS  ·  ' + FP.Library.totalNotes() + ' NOTES', x + w - 18, y + 17, 1.2, 'right');
    U.setFont(ctx, 10, 700);
    ctx.fillStyle = U.rgba(this.mode().color, 0.9);
    ctx.fillText(this.mode().tag + '  ·  ' + this.mode().desc, x + w - 18, y + 35);
  };

  // 绘制「drawSearchBar」相关界面/特效。
  SelectScene.prototype.drawSearchBar = function (ctx) {
    var r = this.searchRect;
    var accent = this.searchActive ? this.mode().color : 'rgba(138, 162, 220, 0.45)';
    U.fillRoundRect(ctx, r.x, r.y, r.w, r.h, 19, this.searchActive ? U.rgba(this.mode().color, 0.10) : 'rgba(12, 17, 38, 0.78)');
    U.strokeRoundRect(ctx, r.x, r.y, r.w, r.h, 19, this.searchActive ? U.rgba(this.mode().color, 0.46) : 'rgba(145, 168, 230, 0.14)', 1.1);
    drawMagnifier(ctx, r.x + 20, r.y + r.h / 2, 9, accent);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    U.setFont(ctx, 13, this.searchQuery ? 600 : 500);
    ctx.fillStyle = this.searchQuery ? '#f2f5ff' : 'rgba(143, 160, 199, 0.55)';
    var queryText = this.searchQuery || '搜索歌曲 / 风格 / 艺术家';
    ctx.fillText(U.truncateText(ctx, queryText, r.w - 125), r.x + 40, r.y + r.h / 2 + 1);
    ctx.textAlign = 'right';
    U.setFont(ctx, 9, 600);
    ctx.fillStyle = 'rgba(145, 165, 207, 0.58)';
    ctx.fillText(this.filteredSongs.length + ' 首', r.x + r.w - 44, r.y + r.h / 2 + 1);
    if (this.searchQuery) {
      var cx = r.x + r.w - 23;
      var cy = r.y + r.h / 2;
      U.fillCircle(ctx, cx, cy, 10, 'rgba(255,255,255,0.08)');
      ctx.strokeStyle = 'rgba(220, 232, 255, 0.7)';
      ctx.lineWidth = 1.4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx - 3.5, cy - 3.5); ctx.lineTo(cx + 3.5, cy + 3.5);
      ctx.moveTo(cx + 3.5, cy - 3.5); ctx.lineTo(cx - 3.5, cy + 3.5);
      ctx.stroke();
    }
  };

  // 绘制「drawScrollbar」相关界面/特效。
  SelectScene.prototype.drawScrollbar = function (ctx) {
    var L = this.layout;
    var vh = L.listBottom - L.listTop;
    if (this.contentHeight <= vh + 4) return;
    var trackX = L.W - 17;
    U.fillRoundRect(ctx, trackX, L.listTop + 8, 3, vh - 16, 1.5, 'rgba(255,255,255,0.07)');
    var thumbH = Math.max(34, (vh - 16) * (vh / this.contentHeight));
    var maxScroll = Math.max(1, this.contentHeight - vh);
    var thumbY = L.listTop + 8 + (vh - 16 - thumbH) * (this.scrollY / maxScroll);
    U.fillRoundRect(ctx, trackX, thumbY, 3, thumbH, 1.5, U.rgba(this.mode().color, 0.55));
  };

  // 绘制「drawEmpty」相关界面/特效。
  SelectScene.prototype.drawEmpty = function (ctx) {
    var L = this.layout;
    var cx = L.W / 2;
    var cy = L.listTop + (L.listBottom - L.listTop) * 0.42;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    U.setFont(ctx, 38, 800);
    ctx.fillStyle = 'rgba(139, 164, 216, 0.26)';
    ctx.fillText('NO TRACK', cx, cy);
    U.setFont(ctx, 14, 600);
    ctx.fillStyle = 'rgba(194, 209, 240, 0.72)';
    ctx.fillText('没有找到「' + U.truncateText(ctx, this.searchQuery, 260) + '」', cx, cy + 42);
    U.setFont(ctx, 11, 500);
    ctx.fillStyle = 'rgba(143, 160, 199, 0.55)';
    ctx.fillText('试试搜索：小星星、古典、流行、茉莉花', cx, cy + 68);
  };

  // 绘制「drawModeTabs」相关界面/特效。
  SelectScene.prototype.drawModeTabs = function (ctx) {

  // 绘制「drawCard」相关界面/特效。
  SelectScene.prototype.drawCard = function (ctx, song, rect, index) {
    var mode = this.mode();
    var entry = U.easeOutCubic(U.clamp((this.entry - 0.08 - Math.min(index, 8) * 0.045) / 0.45, 0, 1));
    if (entry <= 0) return;
    var pressed = this.pressIndex === index;
    var accent = song.theme.a;
    var cardH = rect.h;
    var x = rect.x;
    var y = rect.y + (1 - entry) * 24;
    var scale = pressed ? 0.982 : 1;
    ctx.save();
    ctx.globalAlpha = entry;
    ctx.translate(x + rect.w / 2, y + cardH / 2);
    ctx.scale(scale, scale);
    ctx.translate(-(x + rect.w / 2), -(y + cardH / 2));

    var grad = U.linear(ctx, x, y, x + rect.w, y + cardH, [
      [0, U.rgba(accent, 0.075)],
      [0.28, 'rgba(16, 21, 49, 0.84)'],
      [1, 'rgba(9, 12, 29, 0.93)']
    ]);
    U.fillRoundRect(ctx, x, y, rect.w, cardH, 22, grad);
    U.strokeRoundRect(ctx, x, y, rect.w, cardH, 22, pressed ? U.rgba(accent, 0.45) : 'rgba(150, 172, 240, 0.12)', 1.2);
    U.fillRoundRect(ctx, x, y + 22, 3, cardH - 44, 1.5, U.rgba(accent, pressed ? 0.8 : 0.32));

    var pad = 14;
    var cover = cardH - 28;
    V.drawCoverArt(ctx, x + pad, y + 14, cover, cover, song, this.time);
    var textX = x + pad + cover + 18;
    var textW = rect.w - (textX - x) - 120;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    U.setFont(ctx, 10, 700);
    var cardTag = mode.id === 'endless' ? '无尽基础曲' : song.tag;
    var tagW = ctx.measureText(cardTag).width + 16;
    U.drawPill(ctx, textX, y + 16, tagW, 21, U.rgba(accent, 0.12), U.rgba(accent, 0.26));
    ctx.fillStyle = accent;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(cardTag, textX + tagW / 2, y + 27);

    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    U.setFont(ctx, cardH > 185 ? 30 : 27, 800);
    ctx.fillStyle = '#f8f6ff';
    var title = U.truncateText(ctx, song.title, textW - 34);
    ctx.fillText(title, textX, y + 62);
    if (index === 0) {
      var titleW = ctx.measureText(title).width;
      U.drawPill(ctx, textX + titleW + 8, y + 40, 38, 19, U.rgba(C.COLORS.amber, 0.14), U.rgba(C.COLORS.amber, 0.38));
      U.setFont(ctx, 9, 700);
      ctx.fillStyle = C.COLORS.amber;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('推荐', textX + titleW + 27, y + 49);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
    }

    U.setFont(ctx, 9, 600);
    ctx.fillStyle = 'rgba(157, 178, 226, 0.58)';
    U.spacedText(ctx, U.truncateText(ctx, song.subtitle, textW), textX, y + 82, 1.2, 'left');
    U.setFont(ctx, 11, 500);
    ctx.fillStyle = 'rgba(160, 170, 201, 0.68)';
    ctx.fillText(U.truncateText(ctx, song.artist, textW), textX, y + 102);

    var dy = y + cardH - 24;
    U.setFont(ctx, 9, 600);
    ctx.fillStyle = 'rgba(142, 159, 201, 0.6)';
    U.spacedText(ctx, mode.name, textX, dy, 1, 'left');
    var dotsX = textX + 30;
    for (var d = 0; d < 3; d++) {
      var on = d < mode.level;
      U.fillRoundRect(ctx, dotsX + d * 12, dy - 6, 8, 3.5, 1.5, on ? U.rgba(mode.color, 0.9) : 'rgba(255,255,255,0.12)');
    }
    U.setFont(ctx, 9, 600);
    ctx.fillStyle = 'rgba(142, 159, 201, 0.58)';
    ctx.fillText('BPM ' + song.bpm, dotsX + 44, dy);
    ctx.fillText('·  ' + (mode.id === 'endless' ? '∞' : song.durationLabel), dotsX + 100, dy);

    var bx = x + rect.w - 99;
    var by = y + cardH / 2 + 4;
    var best = FP.Library.getBest(song.id, mode.id);
    ctx.textAlign = 'right';
    U.setFont(ctx, 8, 700);
    ctx.fillStyle = 'rgba(137, 158, 204, 0.58)';
    U.spacedText(ctx, 'BEST · ' + mode.en, bx, by - 17, 1, 'right');
    U.setFont(ctx, 16, 800);
    ctx.fillStyle = best > 0 ? U.rgba(accent, 0.95) : 'rgba(139, 153, 191, 0.4)';
    ctx.fillText(best > 0 ? U.formatScore(best) : '— —', bx, by + 3);
    U.setFont(ctx, 8, 600);
    ctx.fillStyle = 'rgba(145, 162, 202, 0.5)';
    ctx.fillText(FP.Modes.cost(mode.id) + ' 券', bx, by + 22);

    var px = x + rect.w - 42;
    var py = y + cardH / 2;
    ctx.save();
    ctx.shadowColor = U.rgba(accent, 0.55);
    ctx.shadowBlur = 15;
    U.fillCircle(ctx, px, py, 23, U.rgba(accent, 0.11));
    ctx.restore();
    U.strokeCircle(ctx, px, py, 23, U.rgba(accent, 0.46), 1.1);
    U.drawPlay(ctx, px + 1, py, 18, '#ffffff');

      U.fillRoundRect(ctx, card.x, card.y, card.w, card.h, 14, equipped ? U.rgba(trail.color, 0.12) : 'rgba(15, 20, 45, 0.7)');
      U.strokeRoundRect(ctx, card.x, card.y, card.w, card.h, 14, equipped ? U.rgba(trail.color, 0.55) : 'rgba(146, 168, 230, 0.12)', 1);
      ctx.save();
      ctx.shadowColor = trail.color;
      ctx.shadowBlur = 10;
      U.fillCircle(ctx, card.x + 18, card.y + 22, 5, trail.color);

      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      U.setFont(ctx, 11, 700);
      ctx.fillStyle = '#eef3ff';
      ctx.fillText(trail.name, card.x + 28, card.y + 26);
      U.setFont(ctx, 9, 600);
      ctx.fillStyle = equipped ? trail.color : 'rgba(151, 168, 205, 0.65)';
      ctx.fillText(equipped ? '使用中' : (owned ? '点击装备' : trail.price + ' 星钻'), card.x + 12, card.y + 62);
      U.setFont(ctx, 8, 500);
      ctx.fillStyle = 'rgba(126, 146, 190, 0.5)';
      ctx.fillText(owned ? '已解锁' : '外观收藏', card.x + 12, card.y + 80);
    }

    U.setFont(ctx, 9, 700);
    ctx.fillStyle = 'rgba(135, 155, 199, 0.65)';

      U.strokeRoundRect(ctx, pr.x, pr.y, pr.w, pr.h, 16, pack.hot ? 'rgba(72, 233, 255, 0.22)' : 'rgba(146, 168, 230, 0.10)', 1);

      U.setFont(ctx, 22, 800);
      ctx.fillStyle = '#f7f5ff';
      ctx.fillText('+' + pack.diamonds, pr.x + 42, pr.y + 40);
      U.setFont(ctx, 9, 600);

  function drawPill(ctx, r, fill, stroke) {
    U.fillRoundRect(ctx, r.x, r.y, r.w, r.h, r.r || r.h / 2, fill);
    U.strokeRoundRect(ctx, r.x, r.y, r.w, r.h, r.r || r.h / 2, stroke, 1);

  // 绘制「drawDiamond」相关界面/特效。
  function drawDiamond(ctx, cx, cy, s, color) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.lineTo(s * 0.9, -s * 0.25);
    ctx.lineTo(0, s);
    ctx.lineTo(-s * 0.9, -s * 0.25);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-s * 0.55, -s * 0.25);
    ctx.lineTo(s * 0.55, -s * 0.25);
    ctx.stroke();
    ctx.restore();
  }
  // 绘制「drawBolt」相关界面/特效。
  function drawBolt(ctx, cx, cy, s, color) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(s * 0.15, -s);
    ctx.lineTo(-s * 0.62, s * 0.12);
    ctx.lineTo(-s * 0.08, s * 0.12);
    ctx.lineTo(-s * 0.25, s);
    ctx.lineTo(s * 0.62, -s * 0.18);
    ctx.lineTo(s * 0.06, -s * 0.18);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawGift(ctx, cx, cy, s, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = 'rgba(255, 210, 112, 0.18)';
    ctx.lineWidth = 1.5;
    U.roundRectPath(ctx, cx - s, cy - s * 0.28, s * 2, s * 1.22, 2.5);
    ctx.fill();
    ctx.stroke();
    // lid
    ctx.fillStyle = 'rgba(255, 210, 112, 0.24)';
    U.roundRectPath(ctx, cx - s * 1.08, cy - s * 0.55, s * 2.16, s * 0.34, 2);
    ctx.fill();
    ctx.stroke();
    // ribbon
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx, cy - s * 0.55);
    ctx.lineTo(cx, cy + s * 0.94);
    ctx.moveTo(cx - s * 0.98, cy + s * 0.11);
    ctx.lineTo(cx + s * 0.98, cy + s * 0.11);
    ctx.stroke();

    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - s, cy - s);
    ctx.lineTo(cx + s, cy + s);
    ctx.moveTo(cx + s, cy - s);
    ctx.lineTo(cx - s, cy + s);
    ctx.stroke();
    ctx.restore();
  }

    ctx.moveTo(cx + s * 0.28, cy + s * 0.28);
    ctx.lineTo(cx + s * 0.85, cy + s * 0.85);
    ctx.stroke();
    ctx.restore();
  }
