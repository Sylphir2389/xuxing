/* ---- src/main.js ---- */
/* 指尖钢琴节奏 — 入口 / 场景调度 / 主循环 */
(function (root) {
  'use strict';
  var FP = root.FP = root.FP || {};
  var C = FP.C;

  // 执行「GameApp」负责的逻辑。
  function GameApp() {
    this.platform = FP.Platform;
    this.audio = null;
    this.payments = null;
    this.economy = null;
    this.ads = null;
    this.width = C.DESIGN_W;
    this.height = 1334;
    this.current = null;
    this.scenes = {};
    this.debug = { autoplay: false, fast: false, speed: 1, mode: 'hard' };
    this.transition = null;
    this.sceneInput = { start: null, move: null, end: null };
    this.lastTime = 0;
    this.running = false;
    this.frame = 0;
    this.fps = 60;
  }

  // 启动入口：准备运行环境并进入首场景。
  GameApp.prototype.start = function (options) {
    options = options || {};
    this.platform.init();
    FP.Library.init();
    this.width = this.platform.logicalW;
    this.height = this.platform.logicalH;
    this.audio = new FP.AudioEngine();
    this.payments = new FP.Payments();
    this.economy = new FP.Economy(this.payments);
    this.ads = new FP.AdService();
    FP.Social.init();
    var bootQuery = this.platform.getQuery();
    if (bootQuery && bootQuery.invite) FP.Social.importInvite(bootQuery.invite);
    this.readDebug();
    this.scenes = {
      select: new FP.SelectScene(this),
      game: new FP.GameScene(this),
      result: new FP.ResultScene(this),
      modes: new FP.ModeScene(this),
      marble: new FP.MarbleScene(this),
      studio: new FP.StudioScene(this),
      echo: new FP.EchoScene(this)
    };

    var startScene = 'select';
    var params = null;
    var debugScene = this.debug.startScene;
    if (debugScene === 'game' || debugScene === 'result' || debugScene === 'modes' ||
      debugScene === 'marble' || debugScene === 'studio' || debugScene === 'echo') {
      startScene = debugScene;
    }
    if (startScene === 'game') {
      params = { songId: this.debug.songId || FP.Library.songs[0].id, mode: this.debug.mode };
    } else if (startScene === 'result') {
      params = this.makeDebugResult();
    } else {
      params = { mode: this.debug.mode };
    }

    this.switchScene(startScene, params);
    this.bindInput();
    this.bindLifecycle();

    this.running = true;
    this.lastTime = this.platform.now();
    var self = this;
    // 执行「tick」负责的逻辑。
    var tick = function (now) {
      if (!self.running) return;
      var dt = Math.min(0.05, Math.max(0, (now - self.lastTime) / 1000));
      self.lastTime = now;
      self.update(dt);
      self.render();
      self.platform.raf(tick);
    };
    this.platform.raf(tick);
    if (!this.platform.isWechat) root.__FP__ = this;
  };

  // 执行「readDebug」负责的逻辑。
  GameApp.prototype.readDebug = function () {
    var q = this.platform.getQuery();
    if (this.platform.isWechat) return;
    this.debug.autoplay = q.autoplay === '1';
    this.debug.fast = q.fast === '1' || q.scene === 'result';
    this.debug.speed = Math.min(12, Math.max(1, parseFloat(q.speed) || (q.fast === '1' ? 8 : 1)));
    this.debug.startScene = q.scene || 'select';
    this.debug.songId = q.song || null;
    this.debug.mode = q.mode || 'hard';
    this.debug.muted = q.mute === '1';
    this.debug.mockAd = q.mockad === '1';
    if (this.debug.muted) this.audio.muted = true;
    if (this.debug.mockAd) this.ads.cfg.mockOnWeb = true;
  };

  // 生成「makeDebugResult」数据。
  GameApp.prototype.makeDebugResult = function () {
    var base = FP.Library.get(this.debug.songId || FP.Library.songs[0].id);
    var modeId = this.debug.mode || 'hard';
    var song = FP.Modes.buildSong(base, modeId);
    var total = song.notes.length;
    var perfect = Math.max(0, Math.round(total * 0.82));
    var great = Math.round(total * 0.11);
    var good = Math.max(0, total - perfect - great - 3);
    var miss = 3;
    var acc = (perfect + great * 0.6 + good * 0.3) / total * 100;
    return {
      songId: base.id,
      mode: modeId,
      summary: {
        songId: base.id,
        songTitle: song.title,
        mode: modeId,
        modeName: song.modeName || FP.Modes.get(modeId).name,
        endless: modeId === 'endless',
        score: perfect * 100 + great * 60 + good * 30,
        combo: 137,
        maxCombo: 137,
        counts: { perfect: perfect, great: great, good: good, miss: miss },
        noteMisses: miss,
        emptyMisses: 0,
        accuracy: acc,
        health: Math.max(1, song.health - 1),
        healthMax: song.health,
        total: total,
        remaining: 0,
        cleared: modeId !== 'endless',
        grade: FP.U.getGrade(acc),
        survivalMs: 95000,
        wave: 4,
        timestamp: Date.now()
      }
    };
  };

  // 绑定触摸/鼠标输入到当前场景。
  GameApp.prototype.bindInput = function () {
    var self = this;
    this.platform.setInput(
      function (pts) {
        if (!self.audio.ready && !self.audio.failed) self.audio.init();
        if (self.transition) return;
        if (self.sceneInput.start) self.sceneInput.start(pts);
      },
      function (pts) {
        if (self.transition) return;
        if (self.sceneInput.move) self.sceneInput.move(pts);
      },
      function (pts) {
        if (self.transition) return;
        if (self.sceneInput.end) self.sceneInput.end(pts);
      }
    );
  };

  // 绑定前后台与尺寸变化生命周期。
  GameApp.prototype.bindLifecycle = function () {
    var self = this;
    this.platform.onHide(function () {
      if (self.current && self.current.onHide) self.current.onHide();
    });
    this.platform.onResize(function () {
      self.width = self.platform.logicalW;
      self.height = self.platform.logicalH;
      if (self.current && self.current.resize) self.current.resize();
    });
  };

  // 替换当前场景的输入回调。
  GameApp.prototype.setInput = function (start, move, end) {
    this.sceneInput.start = start || null;
    this.sceneInput.move = move || null;
    this.sceneInput.end = end || null;
  };

  // 切换场景并处理过场动画。
  GameApp.prototype.switchScene = function (name, params) {
    var next = this.scenes[name];
    if (!next) throw new Error('Unknown scene: ' + name);
    if (this.current && this.current.exit) this.current.exit();
    this.current = next;
    this.current.enter(params || {});
    this.current.resize && this.current.resize();
  };

  // 执行「goTo」负责的逻辑。
  GameApp.prototype.goTo = function (name, params) {
    if (this.transition) return;
    this.transition = {
      t: 0,
      duration: 0.34,
      alpha: 0,
      target: name,
      params: params || {},
      switched: false
    };
  };

  // 更新「updateTransition」状态。
  GameApp.prototype.updateTransition = function (dt) {
    var tr = this.transition;
    if (!tr) return;
    tr.t += dt;
    var p = Math.min(1, tr.t / tr.duration);
    if (p < 0.5) {
      tr.alpha = FP.U.easeInOutCubic(p * 2);
    } else {
      if (!tr.switched) {
        tr.switched = true;
        this.switchScene(tr.target, tr.params);
      }
      tr.alpha = 1 - FP.U.easeInOutCubic((p - 0.5) * 2);
    }
    if (p >= 1) this.transition = null;
  };

  // 每帧更新逻辑。
  GameApp.prototype.update = function (dt) {
    this.updateTransition(dt);
    if (this.current && this.current.update) this.current.update(dt);
  };

  // 绘制当前画面。
  GameApp.prototype.render = function () {
